<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ехидна Naklz</title>
    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --primary: #4facfe;
            --success: #43e97b;
            --error: #ff4757;
            --text: #ffffff;
            --sec: #888;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { width: 100%; max-width: 400px; }
        .header { text-align: center; margin-bottom: 20px; }
        .echidna {
            width: 100px; height: 100px;
            background: #fff; border-radius: 50%;
            margin: 0 auto 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 50px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            animation: bounce 2s infinite;
        }
        @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        h1 { margin-bottom: 5px; font-size: 24px; }
        .subtitle { color: var(--sec); font-size: 13px; }
        
        .btn {
            width: 100%; padding: 14px; margin: 8px 0;
            border: none; border-radius: 12px;
            font-size: 15px; font-weight: 600;
            cursor: pointer; color: #fff;
            transition: transform 0.1s, filter 0.1s;
        }
        .btn:active { transform: scale(0.96); filter: brightness(0.9); }
        .btn-primary { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        .btn-success { background: linear-gradient(135deg, #43e97b, #38f9d7); }
        .btn-error { background: linear-gradient(135deg, #ff4757, #ff6b81); }
        .btn-sec { background: linear-gradient(135deg, #fa709a, #fee140); color: #000; }
        
        .card {
            background: var(--card); padding: 12px; border-radius: 10px;
            margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
        }
        .choices { display: flex; justify-content: space-around; margin-top: 20px; gap: 10px; }
        .choice-btn {
            flex: 1; height: 80px; border: none; border-radius: 14px;
            font-size: 32px; background: var(--card); color: white; cursor: pointer;
            transition: transform 0.2s;
        }
        .choice-btn:active { transform: scale(0.95); }
        .choice-btn.selected { background: #ffd700; transform: scale(1.05); box-shadow: 0 0 15px #ffd700; }
        .choice-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        
        .status {
            background: var(--card); padding: 12px; border-radius: 10px;
            margin: 15px 0; text-align: center; min-height: 40px; font-size: 15px;
        }
        .hidden { display: none !important; }
        
        .error-box {
            background: var(--error); color: white; padding: 10px;
            border-radius: 8px; margin-bottom: 10px; font-size: 13px;
            text-align: center; display: none; animation: shake 0.4s;
        }
        .error-box.show { display: block; }
        @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
    </style>
</head>
<body>
    <div class="container">
        <div id="errorBox" class="error-box"></div>

        <!-- ГЛАВНОЕ МЕНЮ -->
        <div id="menuScreen">
            <div class="header">
                <div class="echidna">🦔</div>
                <h1>Ехидна Naklz</h1>
                <div class="subtitle">Кулак ✊ • Шип 🌵 • Кристалл 💎</div>
            </div>
            
            <button class="btn btn-success" onclick="createRoom()">💎 Создать комнату (0.1 TON)</button>
            <button class="btn btn-primary" onclick="loadRooms()">🔍 Найти комнату</button>
            <div id="roomsList"></div>
        </div>

        <!-- ЭКРАН ИГРЫ -->
        <div id="gameScreen" class="hidden">
            <div class="header">
                <div class="echidna">🦔</div>
                <h2>Битва!</h2>
            </div>
            <div class="status" id="gameStatus">Ожидание...</div>
            <div class="choices">
                <button class="choice-btn" onclick="makeMove('fist')">✊</button>
                <button class="choice-btn" onclick="makeMove('spike')">🌵</button>
                <button class="choice-btn" onclick="makeMove('crystal')">💎</button>
            </div>
            <button class="btn btn-sec" style="margin-top:15px;" onclick="backToMenu()">🚪 Назад</button>
        </div>
    </div>

    <script>
        // ==========================================
        // ⚠️ ВСТАВЬ СВОИ КЛЮЧИ НИЖЕ ⚠️
        // ==========================================
        const SUPABASE_URL = 'https://tejndwtckdvueufqhitu.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_lNnsJa932mOhwMX21GSnWQ_UG2TjSoe';
        // ==========================================

        // === REST API клиент для Supabase (без внешних библиотек) ===
        async function db(table, method, payload = null, filters = '') {
            // Проверка ключей
            if (!SUPABASE_URL.startsWith('https://') || SUPABASE_KEY.length < 20 || SUPABASE_KEY.includes('ТВОЙ')) {
                throw new Error('❌ Ключи Supabase не заполнены! Проверь код.');
            }
            
            const url = `${SUPABASE_URL}/rest/v1/${table}${filters}`;
            const headers = {
                'apikey': SUPABASE_KEY,
                'Authorization': `Bearer ${SUPABASE_KEY}`,
                'Content-Type': 'application/json',
                'Prefer': 'return=representation',
                'Accept': 'application/json'
            };
            
            const options = { method, headers };
            if (payload) options.body = JSON.stringify(payload);
            
            const response = await fetch(url, options);
            const text = await response.text();
            
            if (!response.ok) {
                throw new Error(`Supabase ${response.status}: ${text}`);
            }
            
            if (!text) return null;
            const data = JSON.parse(text);
            return Array.isArray(data) && data.length === 1 ? data[0] : data;
        }

        // === Telegram WebApp ===
        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready(); tg.expand(); }
        const user = tg?.initDataUnsafe?.user || { id: 999999, username: 'Test', first_name: 'Тест' };

        let currentRoom = null;
        let pollInterval = null;

        function showError(msg) {
            const box = document.getElementById('errorBox');
            box.textContent = msg;
            box.classList.add('show');
            console.error('[Ekhidna]', msg);
            tg?.showAlert?.(msg);
        }

        // === Создание комнаты ===
        async function createRoom() {
            try {
                const room = await db('rooms', 'POST', [{
                    creator_tg_id: user.id,
                    stake: 0.10,
                    status: 'waiting',
                    creator_choice: null,
                    opponent_choice: null
                }]);
                
                currentRoom = room;
                const link = `https://t.me/EkhidnaNaklzBot?start=${room.id}`;
                
                tg?.showAlert?.(`✅ Комната создана!\nСтавка: 0.1 TON\n\nСсылка для друга:\n${link}`);
                showGame('Комната создана! Ждём соперника...');
                startPolling();
            } catch (e) {
                showError(e.message);
            }
        }

        // === Поиск комнат ===
        async function loadRooms() {
            try {
                const rooms = await db('rooms', 'GET', null, 
                    `?status=eq.waiting&creator_tg_id=neq.${user.id}&order=created_at.desc`);
                
                const list = document.getElementById('roomsList');
                list.innerHTML = '';
                
                if (!rooms || rooms.length === 0) {
                    list.innerHTML = '<div style="text-align:center;color:#aaa;padding:15px;">Нет свободных комнат</div>';
                    return;
                }
                
                rooms.forEach(r => {
                    const el = document.createElement('div');
                    el.className = 'card';
                    el.innerHTML = `
                        <div>💰 ${r.stake} TON</div>
                        <button class="btn btn-primary" style="width:auto;padding:8px 15px;" 
                                onclick="joinRoom('${r.id}')">Войти</button>`;
                    list.appendChild(el);
                });
            } catch (e) {
                showError(e.message);
            }
        }

        // === Вход в комнату ===
        async function joinRoom(id) {
            try {
                const room = await db('rooms', 'PATCH', { 
                    opponent_tg_id: user.id, 
                    status: 'playing' 
                }, `?id=eq.${id}&status=eq.waiting`);
                
                if (!room) throw new Error('Комната уже занята');
                
                currentRoom = room;
                document.getElementById('roomsList').innerHTML = '';
                showGame('Вы в игре! Сделайте ход 👇');
                startPolling();
            } catch (e) {
                showError(e.message);
            }
        }

        // === Сделать ход ===
        async function makeMove(choice) {
            if (!currentRoom) return;
            const isCreator = currentRoom.creator_tg_id === user.id;
            const col = isCreator ? 'creator_choice' : 'opponent_choice';
            
            document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
            document.getElementById('gameStatus').innerText = 'Ход записан...';
            
            try {
                await db('rooms', 'PATCH', { [col]: choice }, `?id=eq.${currentRoom.id}`);
                document.getElementById('gameStatus').innerText = 'Ждём соперника...';
            } catch (e) {
                showError(e.message);
            }
        }

        // === Опрос состояния игры ===
        function startPolling() {
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(async () => {
                if (!currentRoom) return;
                try {
                    const rooms = await db('rooms', 'GET', null, `?id=eq.${currentRoom.id}`);
                    const room = rooms?.[0];
                    if (!room) return;
                    currentRoom = room;
                    
                    if (room.status === 'finished') {
                        clearInterval(pollInterval);
                        showResult(room);
                        return;
                    }
                    if (room.creator_choice && room.opponent_choice && room.status === 'playing') {
                        clearInterval(pollInterval);
                        await finishGame(room);
                    }
                } catch (e) { console.warn('Poll error:', e); }
            }, 2000);
        }

        // === Определение победителя ===
        async function finishGame(room) {
            const result = calculateWinner(room);
            await db('rooms', 'PATCH', { status: 'finished' }, `?id=eq.${room.id}`);
            
            // Обновляем статистику (упрощённо)
            if (result.winnerId) {
                try {
                    await db('users', 'PATCH', { wins: 1 }, `?telegram_id=eq.${result.winnerId}`);
                } catch(e) { console.warn('Stats error:', e); }
            }
            showResult({ ...room, result: result.msg });
        }

        function calculateWinner(room) {
            const { creator_choice: c1, opponent_choice: c2, creator_tg_id: id1, opponent_tg_id: id2 } = room;
            
            if (c1 === c2) return { msg: '🤝 Ничья! Переигровка...', winnerId: null };
            
            // Правила: Кулак > Шип > Кристалл > Кулак
            const beats = { fist: 'spike', spike: 'crystal', crystal: 'fist' };
            const creatorWins = beats[c1] === c2;
            
            let msg, winnerId;
            if (creatorWins) {
                msg = (user.id === id1) ? '🏆 Ты победил!' : '😢 Ты проиграл';
                winnerId = id1;
            } else {
                msg = (user.id === id2) ? '🏆 Ты победил!' : '😢 Ты проиграл';
                winnerId = id2;
            }
            return { msg, winnerId };
        }

        function showResult(room) {
            const msg = room.result || calculateWinner(room).msg;
            document.getElementById('gameStatus').innerText = msg;
            tg?.showAlert?.(msg);
            setTimeout(backToMenu, 3000);
        }

        function showGame(statusText) {
            document.getElementById('menuScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            document.getElementById('gameStatus').innerText = statusText || 'Сделайте ход 👇';
            document.querySelectorAll('.choice-btn').forEach(b => b.disabled = false);
        }

        function backToMenu() {
            if (pollInterval) clearInterval(pollInterval);
            currentRoom = null;
            document.getElementById('menuScreen').classList.remove('hidden');
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('roomsList').innerHTML = '';
        }

        // === Авто-вход по ссылке из бота ===
        const startParam = tg?.initDataUnsafe?.start_param;
        if (startParam && !startParam.startsWith('demo-')) {
            setTimeout(() => joinRoom(startParam), 500);
        }
    </script>
</body>
</html>
