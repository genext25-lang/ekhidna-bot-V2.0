<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ехидна Naklz</title>
    <style>
        :root {
            --bg: #0a0a1a;
            --card: #1a1a2e;
            --card-hover: #252545;
            --primary: #6366f1;
            --primary-light: #818cf8;
            --success: #10b981;
            --error: #ef4444;
            --gold: #fbbf24;
            --text: #f8fafc;
            --sec: #94a3b8;
            --border: #334155;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Фоновый градиент */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, #1e1b4b 0%, transparent 50%),
                        radial-gradient(circle at 70% 80%, #312e81 0%, transparent 50%);
            z-index: -1;
            animation: bgShift 20s ease-in-out infinite alternate;
        }
        @keyframes bgShift {
            0% { transform: translate(0, 0); }
            100% { transform: translate(5%, 3%); }
        }

        .container { max-width: 420px; margin: 0 auto; padding: 15px; }
        
        /* Шапка */
        .header { text-align: center; padding: 10px 0 20px; position: relative; }
        .header-logo { 
            width: 90px; height: 90px; margin: 0 auto 12px; 
            filter: drop-shadow(0 0 20px rgba(99, 102, 241, 0.5));
            animation: logoFloat 3s ease-in-out infinite;
        }
        @keyframes logoFloat { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-8px) scale(1.05); } }
        .header h1 { font-size: 22px; font-weight: 700; background: linear-gradient(135deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-sub { font-size: 12px; color: var(--sec); margin-top: 4px; }
        
        /* Статистика игрока */
        .player-stats {
            display: flex; gap: 8px; margin-bottom: 16px;
            background: var(--card); border-radius: 16px; padding: 12px; border: 1px solid var(--border);
        }
        .stat-box { flex: 1; text-align: center; }
        .stat-val { font-size: 20px; font-weight: 700; color: var(--primary-light); }
        .stat-lbl { font-size: 10px; color: var(--sec); text-transform: uppercase; letter-spacing: 0.5px; }
        .skin-badge {
            display: inline-block; background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #000; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px;
            margin-top: 4px;
        }

        /* Кнопки */
        .btn {
            width: 100%; padding: 14px; margin: 6px 0; border: none; border-radius: 14px;
            font-size: 14px; font-weight: 600; cursor: pointer; color: #fff;
            transition: all 0.2s; position: relative; overflow: hidden;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); box-shadow: 0 4px 15px rgba(99,102,241,0.4); }
        .btn-success { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 4px 15px rgba(16,185,129,0.4); }
        .btn-gold { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #000; box-shadow: 0 4px 15px rgba(251,191,36,0.4); }
        .btn-sec { background: var(--card); border: 1px solid var(--border); color: var(--sec); }
        .btn-small { width: auto; padding: 8px 16px; font-size: 12px; display: inline-block; }

        /* Секции */
        .section-title { font-size: 13px; color: var(--sec); margin: 18px 0 8px; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
        .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

        /* Карточки комнат */
        .room-card {
            background: var(--card); border-radius: 14px; margin-bottom: 8px; padding: 14px;
            display: flex; align-items: center; gap: 12px; border: 1px solid var(--border);
            transition: all 0.2s;
        }
        .room-card:active { transform: scale(0.98); background: var(--card-hover); }
        .room-card.my-room { border-left: 3px solid var(--success); }
        .room-icon { width: 44px; height: 44px; border-radius: 12px; background: linear-gradient(135deg, #6366f1, #8b5cf6); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .room-icon svg { width: 24px; height: 24px; }
        .room-info { flex: 1; min-width: 0; }
        .room-stake { font-weight: 700; color: var(--gold); font-size: 15px; }
        .room-creator { font-size: 12px; color: var(--sec); }
        .room-time { font-size: 10px; color: #64748b; }
        .room-badge { display: inline-block; background: var(--success); color: #fff; font-size: 9px; font-weight: 700; padding: 2px 6px; border-radius: 8px; margin-left: 6px; }
        .room-btn { padding: 8px 14px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 12px; flex-shrink: 0; }
        .room-btn.join { background: var(--primary); color: #fff; }
        .room-btn.cancel { background: var(--error); color: #fff; }

        /* Экран игры */
        .game-header { text-align: center; padding: 10px 0; }
        .game-players { display: flex; justify-content: space-around; align-items: center; margin: 15px 0; }
        .player-avatar { width: 70px; height: 70px; border-radius: 50%; background: var(--card); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .player-avatar svg { width: 50px; height: 50px; }
        .vs-badge { font-size: 20px; font-weight: 700; color: var(--error); }
        .move-display { font-size: 40px; margin: 10px 0; }
        
        /* Кнопки ходов с картинками */
        .choices { display: flex; justify-content: center; gap: 12px; margin: 20px 0; }
        .choice-btn {
            width: 90px; height: 90px; border: 2px solid var(--border); border-radius: 20px;
            background: var(--card); cursor: pointer; transition: all 0.2s;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .choice-btn svg { width: 40px; height: 40px; margin-bottom: 4px; }
        .choice-btn span { font-size: 10px; color: var(--sec); font-weight: 600; }
        .choice-btn:active { transform: scale(0.92); }
        .choice-btn.selected { border-color: var(--gold); background: linear-gradient(135deg, #fbbf2422, #f59e0b22); box-shadow: 0 0 20px rgba(251,191,36,0.3); }
        .choice-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Статус */
        .status-box {
            background: var(--card); border-radius: 14px; padding: 16px; text-align: center;
            margin: 15px 0; border: 1px solid var(--border); min-height: 50px;
            display: flex; align-items: center; justify-content: center;
        }
        .status-box.win { border-color: var(--success); background: linear-gradient(135deg, #10b98122, #05966911); }
        .status-box.lose { border-color: var(--error); background: linear-gradient(135deg, #ef444422, #dc262611); }

        /* Таблица лидеров */
        .lb-row {
            display: flex; align-items: center; background: var(--card); border-radius: 14px;
            padding: 12px; margin-bottom: 8px; border: 1px solid var(--border);
        }
        .lb-row.top-1 { border-color: #fbbf2455; background: linear-gradient(135deg, #fbbf2411, transparent); }
        .lb-row.top-2 { border-color: #c0c0c044; background: linear-gradient(135deg, #c0c0c011, transparent); }
        .lb-row.top-3 { border-color: #cd7f3244; background: linear-gradient(135deg, #cd7f3211, transparent); }
        .lb-rank { font-size: 16px; font-weight: 700; width: 32px; text-align: center; }
        .lb-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--bg); margin: 0 10px; overflow: hidden; }
        .lb-avatar svg { width: 100%; height: 100%; }
        .lb-info { flex: 1; }
        .lb-name { font-weight: 600; font-size: 14px; }
        .lb-sub { font-size: 10px; color: var(--sec); }
        .lb-wins { font-weight: 700; color: var(--gold); }

        /* Магазин скинов */
        .skin-card {
            background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 12px;
            border: 2px solid var(--border); display: flex; align-items: center; gap: 14px;
            transition: all 0.2s;
        }
        .skin-card.unlocked { border-color: var(--success); }
        .skin-card.active { border-color: var(--gold); box-shadow: 0 0 20px rgba(251,191,36,0.2); }
        .skin-card.locked { opacity: 0.6; }
        .skin-preview { width: 60px; height: 60px; border-radius: 14px; overflow: hidden; flex-shrink: 0; }
        .skin-preview svg { width: 100%; height: 100%; }
        .skin-info { flex: 1; }
        .skin-name { font-weight: 600; font-size: 15px; }
        .skin-desc { font-size: 11px; color: var(--sec); margin-top: 2px; }
        .skin-req { font-size: 10px; color: var(--sec); margin-top: 4px; }
        .skin-btn { padding: 8px 14px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 12px; }
        .skin-btn.equipped { background: var(--success); color: #fff; }
        .skin-btn.equip { background: var(--primary); color: #fff; }
        .skin-btn.locked { background: var(--border); color: var(--sec); cursor: not-allowed; }

        /* Загрузка */
        .loader { text-align: center; padding: 30px; color: var(--sec); }
        .spinner { border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; width: 28px; height: 28px; animation: spin 0.8s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Утилиты */
        .hidden { display: none !important; }
        .empty-list { text-align: center; color: var(--sec); padding: 30px; }
        .error-debug { background: #1a0a0a; border: 1px solid var(--error); color: #ff8888; padding: 10px; border-radius: 8px; margin: 10px 0; font-size: 11px; font-family: monospace; display: none; white-space: pre-wrap; }
        .error-debug.show { display: block; }
        .mt-10 { margin-top: 10px; }
        
        /* Нижняя навигация */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--card); border-top: 1px solid var(--border);
            display: flex; padding: 8px 0 max(8px, env(safe-area-inset-bottom));
            z-index: 100;
        }
        .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; color: var(--sec); font-size: 10px; cursor: pointer; padding: 4px; }
        .nav-btn.active { color: var(--primary-light); }
        .nav-btn svg { width: 24px; height: 24px; }
        
        /* Отступ для навбара */
        .nav-spacer { height: 70px; }

        /* Анимация победы */
        @keyframes celebrate { 0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
        .celebrate { animation: celebrate 0.5s ease-in-out; }
    </style>
</head>

        // === Базовая логика ===
        async function db(table, method, payload = null, filters = '', returnSingle = false) {
            if (!SUPABASE_URL.startsWith('https://') || SUPABASE_KEY.length < 20 || SUPABASE_KEY.includes('ВСТАВЬ')) {
                throw new Error('❌ SUPABASE_KEY не заполнен!');
            }
            const url = `${SUPABASE_URL}/rest/v1/${table}${filters}`;
            const headers = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation', 'Accept': 'application/json' };
            const options = { method, headers };
            if (payload) options.body = JSON.stringify(payload);
            const response = await fetch(url, options);
            const text = await response.text();
            if (!response.ok) {
                const errorBox = document.getElementById('errorDebug');
                errorBox.textContent = `Supabase Error ${response.status}:\n${text}`;
                errorBox.classList.add('show');
                throw new Error(`Supabase ${response.status}: ${text}`);
            }
            if (!text) return returnSingle ? null : [];
            const data = JSON.parse(text);
            if (returnSingle && Array.isArray(data) && data.length > 0) return data[0];
            if (!returnSingle) return Array.isArray(data) ? data : [data];
            return data;
        }

        async function callRpc(funcName, params) {
            const url = `${SUPABASE_URL}/rest/v1/rpc/${funcName}`;
            const headers = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json' };
            const response = await fetch(url, { method: 'POST', headers, body: JSON.stringify(params) });
            if (!response.ok) throw new Error(`RPC Error: ${await response.text()}`);
        }

        function parseRealUser() {
            if (window.Telegram?.WebApp?.initDataUnsafe?.user) return window.Telegram.WebApp.initDataUnsafe.user;
            try {
                const hash = window.location.hash.startsWith('#') ? window.location.hash.slice(1) : window.location.hash;
                const search = window.location.search.startsWith('?') ? window.location.search.slice(1) : window.location.search;
                const full = `${hash}&${search}`;
                const params = new URLSearchParams(full);
                const tgData = params.get('tgWebAppData');
                if (tgData) {
                    const dataParams = new URLSearchParams(decodeURIComponent(tgData));
                    const userJSON = dataParams.get('user');
                    if (userJSON) return JSON.parse(decodeURIComponent(userJSON));
                }
            } catch (e) { console.warn('User parse error:', e); }
            return { id: 999999, username: 'Guest', first_name: 'Гость' };
        }

        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready?.(); tg.expand?.(); }
        const user = parseRealUser();

        let currentRoom = null;
        let pollInterval = null;
        let currentSkin = 'default';

        function showError(msg) { alert('⚠️ ' + msg); document.getElementById('errorDebug').textContent = msg; document.getElementById('errorDebug').classList.add('show'); }

        // === Навигация ===
        function showScreen(name) {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            const screen = document.getElementById(name + 'Screen');
            if (screen) screen.classList.remove('hidden');
            
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            const navIdx = { lobby: 0, game: 1, skins: 2, leaderboard: 3 }[name];
            document.querySelectorAll('.nav-btn')[navIdx]?.classList.add('active');

            if (name === 'lobby') loadRooms();
            if (name === 'skins') renderSkins();
            if (name === 'leaderboard') loadLeaderboard();
        }

        // === Статистика ===
        async function updatePlayerStats() {
            try {
                const userData = await db('users', 'GET', null, `?telegram_id=eq.${user.id}&select=wins`, false);
                const wins = userData[0]?.wins || 0;
                document.getElementById('statWins').textContent = wins;
                document.getElementById('statGames').textContent = wins * 2; // Приблизительно
                
                // Определяем скин
                let skinIdx = 0;
                for (let i = SKINS.length - 1; i >= 0; i--) {
                    if (wins >= SKINS[i].wins) { skinIdx = i; break; }
                }
                currentSkin = SKINS[skinIdx].id;
                document.getElementById('statLevel').textContent = skinIdx + 1;
                document.getElementById('statSkinBadge').textContent = SKINS[skinIdx].name;
                
                // Обновляем лого
                document.getElementById('mainLogo').innerHTML = SKINS[skinIdx].svg;
            } catch (e) { console.warn('Stats error:', e); }
        }

        // === Комнаты ===
        async function createRoom() {
            try {
                document.getElementById('errorDebug').classList.remove('show');
                const room = await db('rooms', 'POST', [{ creator_tg_id: user.id, creator_username: user.username, stake: 0.10, status: 'waiting', creator_choice: null, opponent_choice: null }], '', true);
                currentRoom = room;
                showGameScreen('✅ Комната создана! Ждём соперника...');
                startPolling();
                loadRooms();
            } catch (e) { showError(e.message); }
        }

        async function cancelRoom(roomId) {
            if (!confirm('Отменить комнату?')) return;
            try { await db('rooms', 'DELETE', null, `?id=eq.${roomId}&status=eq.waiting&creator_tg_id=eq.${user.id}`); loadRooms(); } 
            catch (e) { showError('Не удалось отменить: ' + e.message); }
        }

        async function loadRooms() {
            document.getElementById('errorDebug').classList.remove('show');
            try {
                const myRooms = await db('rooms', 'GET', null, `?status=eq.waiting&creator_tg_id=eq.${user.id}&order=created_at.desc&limit=10`);
                renderMyRooms(Array.isArray(myRooms) ? myRooms : []);
            } catch (e) { document.getElementById('myRoomsList').innerHTML = `<div style="color:var(--error);padding:15px;">${e.message}</div>`; }
            try {
                const rooms = await db('rooms', 'GET', null, `?status=eq.waiting&creator_tg_id=neq.${user.id}&order=created_at.desc&limit=20`);
                renderPublicRooms(Array.isArray(rooms) ? rooms : []);
            } catch (e) { document.getElementById('roomsList').innerHTML = `<div style="color:var(--error);padding:15px;">${e.message}</div>`; }
        }

        function renderRoomHTML(room, isMy) {
            return `<div class="room-info">
                <div class="room-stake">💰 ${room.stake} TON ${isMy ? '<span class="room-badge">ЖДЁТ</span>' : ''}</div>
                <div class="room-creator">@${room.creator_username || 'Аноним'}</div>
                <div class="room-time">🕐 ${formatTime(room.created_at)}</div>
            </div>
            <button class="room-btn ${isMy ? 'cancel' : 'join'}" onclick="${isMy ? `cancelRoom('${room.id}')` : `joinRoom('${room.id}')`}">
                ${isMy ? '✕' : 'Войти'}
            </button>`;
        }

        function renderMyRooms(rooms) {
            const c = document.getElementById('myRoomsList'); c.innerHTML = '';
            if (!rooms.length) { c.innerHTML = '<div class="empty-list">Нет ожидающих комнат</div>'; return; }
            rooms.forEach(r => { const el = document.createElement('div'); el.className = 'room-card my-room'; el.innerHTML = renderRoomHTML(r, true); c.appendChild(el); });
        }

        function renderPublicRooms(rooms) {
            const c = document.getElementById('roomsList'); c.innerHTML = '';
            if (!rooms.length) { c.innerHTML = '<div class="empty-list">Нет доступных комнат</div>'; return; }
            rooms.forEach(r => { const el = document.createElement('div'); el.className = 'room-card'; el.innerHTML = renderRoomHTML(r, false); c.appendChild(el); });
        }

        async function joinRoom(roomId) {
            try {
                const room = await db('rooms', 'PATCH', { opponent_tg_id: user.id, opponent_username: user.username, status: 'playing' }, `?id=eq.${roomId}&status=eq.waiting`, true);
                if (!room) { showError('Комната занята'); loadRooms(); return; }
                currentRoom = room; showGameScreen('✅ Вы в игре! Сделайте ход'); startPolling();
            } catch (e) { showError(e.message); }
        }

        // === Игра ===
        async function makeMove(choice) {
            if (!currentRoom) return;
            const isCreator = currentRoom.creator_tg_id === user.id;
            const col = isCreator ? 'creator_choice' : 'opponent_choice';
            document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
            document.getElementById('gameStatus').innerHTML = '<div class="spinner"></div>Ход записан...';
            try {
                await db('rooms', 'PATCH', { [col]: choice }, `?id=eq.${currentRoom.id}`);
                document.getElementById('gameStatus').innerHTML = 'Ждём соперника...';
            } catch (e) { showError(e.message); document.querySelectorAll('.choice-btn').forEach(b => b.disabled = false); }
        }

        function showGameScreen(statusText) {
            document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
            document.getElementById('gameScreen').classList.remove('hidden');
            document.getElementById('gameStatus').innerHTML = statusText;
            document.getElementById('moveResult').innerHTML = '';
            document.querySelectorAll('.choice-btn').forEach(b => b.disabled = false);
            
            // Обновляем аватары
            const skinSvg = SKINS.find(s => s.id === currentSkin)?.svg || SKINS[0].svg;
            document.getElementById('playerAvatar').innerHTML = skinSvg;
            document.getElementById('opponentAvatar').innerHTML = `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="#374151"/><text x="50" y="60" text-anchor="middle" fill="#9ca3af" font-size="30">?</text></svg>`;
        }

        function startPolling() {
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(async () => {
                if (!currentRoom) return;
                try {
                    const rooms = await db('rooms', 'GET', null, `?id=eq.${currentRoom.id}`);
                    const room = Array.isArray(rooms) ? rooms[0] : rooms;
                    if (!room) return; currentRoom = room;
                    if (room.status === 'finished') { clearInterval(pollInterval); showGameResult(room); return; }
                    if (room.creator_choice && room.opponent_choice && room.status === 'playing') { clearInterval(pollInterval); await finishGame(room); } 
                    else if (!room.opponent_choice && room.creator_choice) { document.getElementById('gameStatus').innerHTML = 'Соперник думает...'; }
                } catch (e) { console.warn('Poll error:', e); }
            }, 2000);
        }

        async function finishGame(room) {
            const result = calculateWinner(room);
            await db('rooms', 'PATCH', { status: 'finished' }, `?id=eq.${room.id}`);
            if (result.winnerId) { try { await callRpc('increment_wins', { p_tg_id: result.winnerId }); } catch(e) {} }
            showGameResult({ ...room, result: result.msg });
        }

        function calculateWinner(room) {
            const { creator_choice: c1, opponent_choice: c2, creator_tg_id: id1, opponent_tg_id: id2 } = room;
            if (c1 === c2) return { msg: '🤝 Ничья!', winnerId: null };
            const beats = { fist: 'spike', spike: 'crystal', crystal: 'fist' };
            const creatorWins = beats[c1] === c2;
            return { msg: (creatorWins ? (user.id === id1) : (user.id === id2)) ? '🏆 Победа!' : '😢 Поражение', winnerId: creatorWins ? id1 : id2 };
        }

        function showGameResult(room) {
            const result = calculateWinner(room);
            const msg = room.result || result.msg;
            const isWin = msg.includes('Победа');
            const isDraw = msg.includes('Ничья');
            
            document.getElementById('gameStatus').className = `status-box ${isWin ? 'win' : isDraw ? '' : 'lose'}`;
            document.getElementById('gameStatus').innerHTML = `<div class="celebrate">${msg}</div>`;
            
            // Показываем ходы
            const moveIcons = { fist: '✊', spike: '🌵', crystal: '💎' };
            document.getElementById('moveResult').innerHTML = `
                <div style="font-size:14px;color:var(--sec);margin-bottom:8px;">Результат раунда:</div>
                <div style="display:flex;justify-content:center;gap:20px;font-size:24px;">
                    <span>${moveIcons[room.creator_choice] || '?'}</span>
                    <span style="color:var(--sec)">vs</span>
                    <span>${moveIcons[room.opponent_choice] || '?'}</span>
                </div>
            `;
            
            updatePlayerStats();
            setTimeout(() => showScreen('lobby'), 4000);
        }

        // === Скины ===
        function renderSkins() {
            const c = document.getElementById('skinsList'); c.innerHTML = '';
            SKINS.forEach((skin, i) => {
                const unlocked = (document.getElementById('statWins')?.textContent || 0) >= skin.wins;
                const isActive = currentSkin === skin.id;
                const el = document.createElement('div');
                el.className = `skin-card ${unlocked ? 'unlocked' : 'locked'} ${isActive ? 'active' : ''}`;
                el.innerHTML = `
                    <div class="skin-preview">${skin.svg}</div>
                    <div class="skin-info">
                        <div class="skin-name">${skin.name}</div>
                        <div class="skin-desc">${skin.desc}</div>
                        ${!unlocked ? `<div class="skin-req">🔒 Нужно ${skin.wins} побед</div>` : `<div class="skin-req" style="color:var(--success)">✅ Разблокировано</div>`}
                    </div>
                    <button class="skin-btn ${isActive ? 'equipped' : unlocked ? 'equip' : 'locked'}" 
                        ${!unlocked ? 'disabled' : ''} 
                        onclick="${unlocked ? `equipSkin('${skin.id}')` : ''}">
                        ${isActive ? '✓' : unlocked ? 'Надеть' : '🔒'}
                    </button>
                `;
                c.appendChild(el);
            });
        }

        function equipSkin(skinId) {
            currentSkin = skinId;
            const skin = SKINS.find(s => s.id === skinId);
            document.getElementById('mainLogo').innerHTML = skin.svg;
            document.getElementById('statSkinBadge').textContent = skin.name;
            renderSkins();
        }

        // === Рейтинг ===
        async function loadLeaderboard() {
            const c = document.getElementById('leaderboardList');
            c.innerHTML = '<div class="loader"><div class="spinner"></div></div>';
            try {
                const users = await db('users', 'GET', null, '?select=username,wins,telegram_id&order=wins.desc.nullslast&limit=10');
                renderLeaderboard(Array.isArray(users) ? users : []);
            } catch (e) { c.innerHTML = `<div style="color:var(--error);padding:15px;">${e.message}</div>`; }
        }

        function renderLeaderboard(users) {
            const c = document.getElementById('leaderboardList'); c.innerHTML = '';
            if (!users.length) { c.innerHTML = '<div class="empty-list">Пока нет игроков. Будь первым! 🦔</div>'; return; }
            const medals = ['🥇', '🥈', ''];
            users.forEach((u, i) => {
                const rank = i + 1;
                const wins = u.wins || 0;
                const skinIdx = Math.min(SKINS.length - 1, wins >= 30 ? 4 : wins >= 15 ? 3 : wins >= 8 ? 2 : wins >= 3 ? 1 : 0);
                const el = document.createElement('div');
                el.className = `lb-row top-${rank <= 3 ? rank : ''}`;
                el.innerHTML = `
                    <div class="lb-rank">${medals[i] || rank}</div>
                    <div class="lb-avatar">${SKINS[skinIdx].svg}</div>
                    <div class="lb-info">
                        <div class="lb-name">@${u.username || 'Аноним'}</div>
                        <div class="lb-sub">${SKINS[skinIdx].name}</div>
                    </div>
                    <div class="lb-wins">${wins}</div>
                `;
                c.appendChild(el);
            });
        }

        // === Утилиты ===
        function formatTime(iso) {
            if (!iso) return '';
            const diff = Math.floor((Date.now() - new Date(iso)) / 1000);
            if (diff < 60) return 'только что';
            if (diff < 3600) return `${Math.floor(diff/60)} мин назад`;
            return new Date(iso).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
        }

        // === Инициализация ===
        window.addEventListener('load', () => {
            setTimeout(() => {
                loadRooms();
                updatePlayerStats();
            }, 300);
        });
    </script>
</body>
</html>
