<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ехидна Naklz - Тест</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        /* Стили те же */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #1e3c72; color: white; padding: 20px; text-align: center; min-height: 100vh; }
        .echidna { width: 100px; height: 100px; background: #fff; border-radius: 50%; margin: 20px auto; display: flex; align-items: center; justify-content: center; font-size: 50px; }
        h1 { margin-bottom: 20px; }
        .btn { width: 100%; padding: 15px; margin: 10px 0; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; background: #4facfe; color: white; }
        .choice-box { display: flex; justify-content: space-around; margin-top: 30px; }
        .choice-btn { width: 70px; height: 70px; border-radius: 50%; border: none; font-size: 30px; background: rgba(255,255,255,0.2); color: white; cursor: pointer; }
        .hidden { display: none; }
        .status { margin: 20px 0; padding: 10px; background: rgba(0,0,0,0.3); border-radius: 8px; }
    </style>
</head>
<body>
    <div id="menu">
        <div class="echidna">🦔</div>
        <h1>Ехидна Naklz</h1>
        <p>Тестовая версия (Без базы данных)</p>
        <button class="btn" onclick="startGame()">Начать игру</button>
    </div>

    <div id="game" class="hidden">
        <div class="echidna"></div>
        <h2>Битва!</h2>
        <div class="status" id="status">Выбери ход:</div>
        <div class="choice-box">
            <button class="choice-btn" onclick="play('fist')">✊</button>
            <button class="choice-btn" onclick="play('spike')">🌵</button>
            <button class="choice-btn" onclick="play('crystal')"></button>
        </div>
        <button class="btn" style="margin-top: 30px; background: #ff6b6b;" onclick="backToMenu()">Выйти</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Получаем имя пользователя для теста
        const user = tg.initDataUnsafe?.user?.first_name || "Игрок";
        alert(`Привет, ${user}! Игра загружена.`);

        function startGame() {
            document.getElementById('menu').classList.add('hidden');
            document.getElementById('game').classList.remove('hidden');
            document.getElementById('status').innerText = "Твой ход!";
        }

        function play(myChoice) {
            document.getElementById('status').innerText = "Соперник думает...";
            
            // Имитация задержки (как будто ждем другого игрока)
            setTimeout(() => {
                const moves = ['fist', 'spike', 'crystal'];
                const opponentChoice = moves[Math.floor(Math.random() * 3)];
                
                let resultText = "";
                if (myChoice === opponentChoice) {
                    resultText = "🤝 Ничья!";
                } else if (
                    (myChoice === 'fist' && opponentChoice === 'spike') ||
                    (myChoice === 'spike' && opponentChoice === 'crystal') ||
                    (myChoice === 'crystal' && opponentChoice === 'fist')
                ) {
                    resultText = "🏆 Ты победил!";
                } else {
                    resultText = "😢 Ты проиграл!";
                }

                document.getElementById('status').innerText = `Ты: ${myChoice} | Соперник: ${opponentChoice}\n${resultText}`;
                tg.showAlert(resultText);
            }, 1500);
        }

        function backToMenu() {
            document.getElementById('menu').classList.remove('hidden');
            document.getElementById('game').classList.add('hidden');
        }
    </script>
</body>
</html>
