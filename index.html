<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ехидна Naklz</title>
    <style>
        :root { --bg: #0a0a1a; --card: #1a1a2e; --primary: #6366f1; --success: #10b981; --error: #ef4444; --gold: #fbbf24; --text: #f8fafc; --sec: #94a3b8; --border: #334155; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 15px; }
        .container { max-width: 420px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 20px; }
        .header-logo { width: 120px; height: 120px; margin: 0 auto 12px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 30px rgba(99,102,241,0.5); animation: float 3s ease-in-out infinite; }
        .header-logo img { width: 100%; height: 100%; object-fit: cover; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .header h1 { font-size: 22px; margin-bottom: 5px; background: linear-gradient(135deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-sub { font-size: 12px; color: var(--sec); }
        .player-stats { display: flex; gap: 8px; margin-bottom: 16px; background: var(--card); border-radius: 16px; padding: 12px; border: 1px solid var(--border); }
        .stat-box { flex: 1; text-align: center; }
        .stat-val { font-size: 20px; font-weight: 700; color: var(--primary); }
        .stat-lbl { font-size: 10px; color: var(--sec); text-transform: uppercase; }
        .skin-badge { display: inline-block; background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #000; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; margin-top: 4px; }
        .btn { width: 100%; padding: 14px; margin: 6px 0; border: none; border-radius: 14px; font-size: 14px; font-weight: 600; cursor: pointer; color: #fff; transition: all 0.2s; }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
        .btn-success { background: linear-gradient(135deg, #10b981, #059669); }
        .btn-sec { background: var(--card); border: 1px solid var(--border); color: var(--sec); }
        .section-title { font-size: 13px; color: var(--sec); margin: 18px 0 8px; text-transform: uppercase; }
        .room-card { background: var(--card); border-radius: 14px; margin-bottom: 8px; padding: 14px; display: flex; align-items: center; gap: 12px; border: 1px solid var(--border); cursor: pointer; transition: all 0.2s; }
        .room-card:active { transform: scale(0.98); background: var(--card); }
        .room-card.my-room { border-left: 3px solid var(--success); }
        .room-card.my-room.playing { border-left-color: var(--primary); }
        .room-icon { width: 60px; height: 60px; border-radius: 12px; overflow: hidden; flex-shrink: 0; }
        .room-icon img { width: 100%; height: 100%; object-fit: cover; }
        .room-info { flex: 1; }
        .room-stake { font-weight: 700; color: var(--gold); }
        .room-creator { font-size: 12px; color: var(--sec); }
        .room-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .room-btn { padding: 8px 12px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-size: 12px; }
        .room-btn.join { background: var(--primary); color: #fff; }
        .room-btn.cancel { background: var(--error); color: #fff; }
        .room-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .game-players { display: flex; justify-content: space-around; align-items: center; margin: 15px 0; }
        .player-avatar { width: 80px; height: 80px; border-radius: 50%; overflow: hidden; border: 3px solid var(--border); }
        .player-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .vs-badge { font-size: 20px; font-weight: 700; color: var(--error); }
        
        .game-stakes { background: rgba(251,191,36,0.05); border-radius: 12px; padding: 12px; margin: 10px 0; text-align: center; border: 1px solid var(--border); }
        .stake-line { font-size: 14px; font-weight: 600; margin: 4px 0; display: flex; justify-content: space-between; padding: 0 10px; }
        .stake-value { color: var(--gold); }
        .stake-win { color: var(--success); font-size: 16px; }

        .choices { display: flex; justify-content: center; gap: 12px; margin: 20px 0; }
        .choice-btn { width: 100px; height: 100px; border: 2px solid var(--border); border-radius: 20px; background: var(--card); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px; transition: all 0.2s; }
        .choice-btn:active:not(:disabled) { transform: scale(0.95); }
        .choice-btn img { width: 50px; height: 50px; object-fit: contain; margin-bottom: 4px; }
        .choice-btn span { font-size: 11px; color: var(--sec); font-weight: 600; }
        .choice-btn:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(0.8); }
        .status-box { background: var(--card); border-radius: 14px; padding: 16px; text-align: center; margin: 15px 0; border: 1px solid var(--border); min-height: 50px; font-weight: 600; transition: all 0.3s; }
        .hidden { display: none !important; }
        .loader { text-align: center; padding: 30px; color: var(--sec); }
        .spinner { border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; width: 28px; height: 28px; animation: spin 0.8s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 2px solid var(--border); display: flex; padding: 12px 0; z-index: 100; }
        .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: none; color: var(--sec); font-size: 12px; cursor: pointer; }
        .nav-btn.active { color: var(--primary); }
        .nav-btn svg { width: 32px; height: 32px; }
        .nav-spacer { height: 80px; }
        
        .skin-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; animation: fadeIn 0.3s; }
        .skin-modal.hidden { display: none; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .skin-modal-content { background: var(--card); border-radius: 20px; padding: 24px; max-width: 360px; width: 100%; border: 2px solid var(--border); position: relative; animation: slideUp 0.3s; }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .skin-modal-close { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; border-radius: 50%; background: var(--error); border: none; color: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .skin-modal-close:active { transform: scale(0.9); }
        .skin-modal-img { width: 150px; height: 150px; margin: 0 auto 16px; border-radius: 20px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        .skin-modal-img img { width: 100%; height: 100%; object-fit: cover; }
        .skin-modal-title { font-size: 22px; font-weight: 700; text-align: center; margin-bottom: 8px; }
        .skin-modal-level { text-align: center; font-size: 12px; color: var(--gold); margin-bottom: 16px; }
        .skin-modal-desc { font-size: 14px; line-height: 1.6; color: var(--sec); margin-bottom: 16px; text-align: center; }
        .skin-modal-features { background: rgba(99,102,241,0.1); border-radius: 12px; padding: 12px; margin-bottom: 16px; }
        .skin-modal-features-title { font-size: 13px; font-weight: 700; color: var(--primary); margin-bottom: 8px; }
        .skin-modal-features ul { list-style: none; padding: 0; }
        .skin-modal-features li { font-size: 12px; color: var(--sec); padding: 4px 0; padding-left: 20px; position: relative; }
        .skin-modal-features li::before { content: '✓'; position: absolute; left: 0; color: var(--success); font-weight: 700; }
        .skin-modal-req { text-align: center; font-size: 12px; color: var(--sec); padding: 12px; background: rgba(251,191,36,0.1); border-radius: 12px; }
        .skin-modal-req.locked { color: var(--error); background: rgba(239,68,68,0.1); }

        .stake-modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.85); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; animation: fadeIn 0.3s; }
        .stake-modal.hidden { display: none; }
        .stake-modal-content { background: var(--card); border-radius: 20px; padding: 24px; max-width: 360px; width: 100%; border: 2px solid var(--border); position: relative; animation: slideUp 0.3s; }
        .stake-modal-title { font-size: 20px; font-weight: 700; text-align: center; margin-bottom: 16px; }
        .stake-presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 16px; }
        .stake-preset-btn { padding: 12px; border: 2px solid var(--border); border-radius: 12px; background: var(--bg); color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .stake-preset-btn:active { transform: scale(0.95); }
        .stake-preset-btn.selected { border-color: var(--gold); background: rgba(251,191,36,0.15); color: var(--gold); }
        .stake-input-group { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
        .stake-input { flex: 1; padding: 12px; border: 2px solid var(--border); border-radius: 12px; background: var(--bg); color: var(--text); font-size: 16px; text-align: center; outline: none; }
        .stake-input:focus { border-color: var(--primary); }
        .stake-input-label { font-size: 14px; color: var(--sec); font-weight: 600; }
        .stake-error { font-size: 12px; color: var(--error); text-align: center; margin-bottom: 8px; min-height: 16px; }
        .stake-confirm-btn { background: linear-gradient(135deg, #10b981, #059669); }
        .stake-cancel-btn { background: var(--bg); border: 1px solid var(--border); color: var(--sec); }
        
        .lb-stats { font-size: 11px; color: var(--sec); display: flex; gap: 8px; margin-top: 4px; }
        .lb-stats span { display: flex; align-items: center; gap: 2px; }
    </style>
</head>
<body>
    <div class="container">
        <div id="lobbyScreen">
            <div class="header">
                <div class="header-logo"><img src="" id="mainLogoImg" alt="logo"></div>
                <h1>Ехидна Naklz</h1>
                <div class="header-sub">Кулак • Шип • Кристалл</div>
            </div>
            <div class="player-stats">
                <div class="stat-box"><div class="stat-val" id="statWins">0</div><div class="stat-lbl">Побед</div></div>
                <div class="stat-box"><div class="stat-val" id="statGames">0</div><div class="stat-lbl">Игр</div></div>
                <div class="stat-box"><div class="stat-val" id="statLevel">1</div><div class="stat-lbl">Уровень</div><div class="skin-badge" id="statSkinBadge">Обычная</div></div>
            </div>
            <button class="btn btn-success" onclick="openStakeModal()">💎 Создать комнату</button>
            <button class="btn btn-sec" onclick="loadRooms()">🔄 Обновить</button>
            <div class="section-title">Мои комнаты</div>
            <div id="myRoomsList"><div class="loader"><div class="spinner"></div></div></div>
            <div class="section-title">Доступные комнаты</div>
            <div id="roomsList"><div class="loader"><div class="spinner"></div></div></div>
            <div class="nav-spacer"></div>
        </div>

        <div id="gameScreen" class="hidden">
            <div class="header"><h2>⚔️ Битва!</h2></div>
            <div class="game-players">
                <div class="player-avatar"><img src="" id="playerAvatarImg" alt="player"></div>
                <div class="vs-badge">VS</div>
                <div class="player-avatar"><img src="" id="opponentAvatarImg" alt="opponent"></div>
            </div>
            
            <div class="game-stakes" id="gameStakes">
                <div class="stake-line">💰 Ставка: <span id="stakeAmount" class="stake-value">0.1</span> TON</div>
                <div class="stake-line">🏆 Ты получишь (−5%): <span id="winAmount" class="stake-win">0.19</span> TON</div>
            </div>
            
            <div class="status-box" id="gameStatus"><div class="spinner"></div></div>
            <div class="choices" id="choicesArea">
                <button class="choice-btn" onclick="makeMove('fist')">
                    <img src="https://raw.githubusercontent.com/genext25-lang/ekhidna-bot-V2.0/refs/heads/main/move-fist.png" alt="Кулак">
                    <span>Кулак</span>
                </button>
                <button class="choice-btn" onclick="makeMove('spike')">
                    <img src="https://raw.githubusercontent.com/genext25-lang/ekhidna-bot-V2.0/refs/heads/main/move-spike.png" alt="Шип">
                    <span>Шип</span>
                </button>
                <button class="choice-btn" onclick="makeMove('crystal')">
                    <img src="https://raw.githubusercontent.com/genext25-lang/ekhidna-bot-V2.0/refs/heads/main/move-crystal.png" alt="Кристалл">
                    <span>Кристалл</span>
                </button>
            </div>
            <button class="btn btn-sec" onclick="goToLobby()">🏠 В лобби</button>
            <div class="nav-spacer"></div>
        </div>

        <div id="skinsScreen" class="hidden">
            <div class="header"><h2>🎨 Скины</h2><div class="header-sub">Нажми на скин для подробной информации</div></div>
            <div id="skinsList"></div>
            <div class="nav-spacer"></div>
        </div>

        <div id="leaderboardScreen" class="hidden">
            <div class="header"><h2>🏆 Рейтинг</h2></div>
            <div id="leaderboardList"><div class="loader"><div class="spinner"></div></div></div>
            <div class="nav-spacer"></div>
        </div>
    </div>

    <!-- Модальное окно скина -->
    <div id="skinModal" class="skin-modal hidden" onclick="closeSkinModal(event)">
        <div class="skin-modal-content" onclick="event.stopPropagation()">
            <button class="skin-modal-close" onclick="closeSkinModal()">✕</button>
            <div class="skin-modal-img"><img src="" id="modalImg" alt=""></div>
            <div class="skin-modal-title" id="modalTitle"></div>
            <div class="skin-modal-level" id="modalLevel"></div>
            <div class="skin-modal-desc" id="modalDesc"></div>
            <div class="skin-modal-features">
                <div class="skin-modal-features-title">✨ Особенности:</div>
                <ul id="modalFeatures"></ul>
            </div>
            <div class="skin-modal-req" id="modalReq"></div>
        </div>
    </div>

    <!-- Модальное окно выбора ставки -->
    <div id="stakeModal" class="stake-modal hidden" onclick="closeStakeModal(event)">
        <div class="stake-modal-content" onclick="event.stopPropagation()">
            <button class="skin-modal-close" onclick="closeStakeModal()">✕</button>
            <div class="stake-modal-title">💎 Выбери ставку</div>
            <div class="stake-presets" id="stakePresets">
                <button class="stake-preset-btn selected" data-stake="0.1" onclick="selectStake(0.1, this)">0.1 TON</button>
                <button class="stake-preset-btn" data-stake="0.5" onclick="selectStake(0.5, this)">0.5 TON</button>
                <button class="stake-preset-btn" data-stake="1" onclick="selectStake(1, this)">1 TON</button>
                <button class="stake-preset-btn" data-stake="2" onclick="selectStake(2, this)">2 TON</button>
                <button class="stake-preset-btn" data-stake="5" onclick="selectStake(5, this)">5 TON</button>
                <button class="stake-preset-btn" data-stake="10" onclick="selectStake(10, this)">10 TON</button>
            </div>
            <div class="stake-input-group">
                <span class="stake-input-label">Или введи:</span>
                <input type="number" class="stake-input" id="stakeInput" placeholder="0.1 - 99" min="0.1" max="99" step="0.1" oninput="onStakeInput()">
            </div>
            <div class="stake-error" id="stakeError"></div>
            <button class="btn stake-confirm-btn" onclick="confirmStake()">Создать комнату</button>
            <button class="btn stake-cancel-btn" onclick="closeStakeModal()" style="margin-top: 8px;">Отмена</button>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-btn active" onclick="showScreen('lobby')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            <span>Лобби</span>
        </button>
        <button class="nav-btn" onclick="showScreen('game')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polygon points="10 8 16 12 10 16 10 8"/></svg>
            <span>Игра</span>
        </button>
        <button class="nav-btn" onclick="showScreen('skins')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            <span>Скины</span>
        </button>
        <button class="nav-btn" onclick="showScreen('leaderboard')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 21h8M12 17v4M7 4h10c1 0 2 .5 2 2v3c0 1-1 2-2 2H7c-1 0-2-1-2-2V6c0-1.5 1-2 2-2zM6 11h12"/></svg>
            <span>Рейтинг</span>
        </button>
    </div>

    <script>
        const SUPABASE_URL = 'https://tejndwtckdvueufqhitu.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_lNnsJa932mOhwMX21GSnWQ_UG2TjSoe';
        
        function getCurrentUser() {
            if (window.Telegram?.WebApp?.initDataUnsafe?.user) return window.Telegram.WebApp.initDataUnsafe.user;
            try {
                const hash = window.location.hash.startsWith('#') ? window.location.hash.slice(1) : window.location.hash;
                const search = window.location.search.startsWith('?') ? window.location.search.slice(1) : window.location.search;
                const full = `${hash}&${search}`;
                const params = new URLSearchParams(full);
                const tgData = params.get('tgWebAppData');
                if (tgData) {
                    const dataParams = new URLSearchParams(decodeURIComponent(tgData));
                    const userJSON = dataParams.get('user');
                    if (userJSON) return JSON.parse(decodeURIComponent(userJSON));
                }
            } catch (e) { console.warn('User parse error:', e); }
            return { id: 999999, username: 'Guest' };
        }

        const user = getCurrentUser();
        const MY_ID = Number(user.id);

        const SKINS = [
            { id: 'default', name: 'Обычная', wins: 0, img: 'https://raw.githubusercontent.com/genext25-lang/ekhidna-bot-V2.0/refs/heads/main/skin-default.png', desc: 'Стартовая ехидна.', features: ['Базовый скин', 'Для новичков'] },
            { id: 'ice', name: 'Ледяная', wins: 30, img: 'https://raw.githubusercontent.com/genext25-lang/ekhidna-bot-V2.0/refs/heads/main/skin-ice.png', desc: 'Холодный расчёт.', features: ['Ледяные иглы', 'Стратег'] },
            { id: 'fire', name: 'Огненная', wins: 50, img: 'https://raw.githubusercontent.com/genext25-lang/ekhidna-bot-V2.0/refs/heads/main/skin-fire.png', desc: 'Огненный темперамент.', features: ['Агрессивный стиль', 'Быстрая реакция'] },
            { id: 'shadow', name: 'Теневая', wins: 100, img: 'https://raw.githubusercontent.com/genext25-lang/ekhidna-bot-V2.0/refs/heads/main/skin-shadow.png', desc: 'Сила тени.', features: ['Мистика', 'Непредсказуемость'] },
            { id: 'golden', name: 'Золотая', wins: 300, img: 'https://raw.githubusercontent.com/genext25-lang/ekhidna-bot-V2.0/refs/heads/main/skin-golden.png', desc: 'Легенда.', features: ['Корона чемпиона', '300+ побед'] }
        ];

        let selectedStake = 0.1;
        let currentRoom = null;
        let pollInterval = null;
        let currentSkin = 'default';
        let isGameFinished = false;

        async function db(table, method, payload = null, filters = '', single = false) {
            const url = `${SUPABASE_URL}/rest/v1/${table}${filters}`;
            const headers = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' };
            const res = await fetch(url, { method, headers, body: payload ? JSON.stringify(payload) : null });
            if (!res.ok) throw new Error(await res.text());
            const data = await res.json();
            return single && Array.isArray(data) ? data[0] : data;
        }

        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready?.(); tg.expand?.(); }

        // ✅ Мгновенный и безопасный выход в лобби
        function goToLobby() {
            if (currentRoom && currentRoom.status === 'playing' && !isGameFinished) {
                if (!confirm('Вы покинете активную игру. Это будет засчитано как поражение. Уверены?')) return;
                forfeitGame();
            } else {
                leaveGame();
            }
        }

        function leaveGame() {
            isGameFinished = true;
            currentRoom = null;
            if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
            showScreen('lobby');
        }

        async function forfeitGame() {
            if (!currentRoom) return leaveGame();
            isGameFinished = true;
            if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }

            // Помечаем как finished, чтобы соперник увидел результат
            await db('rooms', 'PATCH', { status: 'finished' }, `?id=eq.${currentRoom.id}`);

            // Обновляем статистику
            const oppId = MY_ID === currentRoom.creator_tg_id ? currentRoom.opponent_tg_id : currentRoom.creator_tg_id;
            db('users', 'PATCH', { losses: (currentRoom.leaver_losses || 0) + 1 }, `?telegram_id=eq.${MY_ID}`).catch(console.warn);
            if (oppId) db('users', 'PATCH', { wins: (currentRoom.opponent_wins || 0) + 1 }, `?telegram_id=eq.${oppId}`).catch(console.warn);

            const statusEl = document.getElementById('gameStatus');
            statusEl.className = 'status-box lose';
            statusEl.innerHTML = `<div style="animation:celebrate 0.5s ease-in-out;">😢 Вы покинули игру</div>`;
            
            updateStats();
            setTimeout(() => { leaveGame(); }, 2000);
        }

        async function updateStats() {
            try {
                if (!MY_ID || MY_ID === 999999) return;
                const data = await db('users', 'GET', null, `?telegram_id=eq.${MY_ID}&select=wins,losses`, false);
                const wins = data[0]?.wins || 0;
                const losses = data[0]?.losses || 0;
                document.getElementById('statWins').textContent = wins;
                document.getElementById('statGames').textContent = wins + losses;
                const skinIdx = SKINS.slice().reverse().findIndex(s => wins >= s.wins);
                currentSkin = skinIdx >= 0 ? SKINS[SKINS.length - 1 - skinIdx].id : 'default';
                const skin = SKINS.find(s => s.id === currentSkin);
                document.getElementById('statLevel').textContent = SKINS.findIndex(s => s.id === currentSkin) + 1;
                document.getElementById('statSkinBadge').textContent = skin.name;
                document.getElementById('mainLogoImg').src = skin.img;
            } catch(e) { console.error(e); }
        }

        function openStakeModal() {
            selectedStake = 0.1;
            document.getElementById('stakeInput').value = '';
            document.getElementById('stakeError').textContent = '';
            document.querySelectorAll('.stake-preset-btn').forEach(btn => btn.classList.remove('selected'));
            document.querySelector('.stake-preset-btn[data-stake="0.1"]').classList.add('selected');
            document.getElementById('stakeModal').classList.remove('hidden');
        }

        function closeStakeModal(e) {
            if (!e || e.target.id === 'stakeModal' || e.target.className === 'skin-modal-close') {
                document.getElementById('stakeModal').classList.add('hidden');
            }
        }

        function selectStake(value, btn) {
            selectedStake = value;
            document.getElementById('stakeInput').value = '';
            document.getElementById('stakeError').textContent = '';
            document.querySelectorAll('.stake-preset-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
        }

        function onStakeInput() {
            const val = parseFloat(document.getElementById('stakeInput').value);
            document.querySelectorAll('.stake-preset-btn').forEach(b => b.classList.remove('selected'));
            if (isNaN(val)) { selectedStake = 0.1; document.getElementById('stakeError').textContent = ''; return; }
            if (val < 0.1) { document.getElementById('stakeError').textContent = 'Мин: 0.1 TON'; selectedStake = 0.1; }
            else if (val > 99) { document.getElementById('stakeError').textContent = 'Макс: 99 TON'; selectedStake = 99; }
            else { document.getElementById('stakeError').textContent = ''; selectedStake = Math.round(val * 100) / 100; }
        }

        async function confirmStake() {
            const inputVal = document.getElementById('stakeInput').value;
            let finalStake = selectedStake;
            if (inputVal) {
                const parsed = parseFloat(inputVal);
                if (parsed < 0.1 || parsed > 99 || isNaN(parsed)) { document.getElementById('stakeError').textContent = 'Введи от 0.1 до 99'; return; }
                finalStake = Math.round(parsed * 100) / 100;
            }
            document.getElementById('stakeModal').classList.add('hidden');
            try {
                const room = await db('rooms', 'POST', [{ creator_tg_id: MY_ID, creator_username: user.username, stake: finalStake, status: 'waiting' }], '', true);
                currentRoom = room;
                showGameScreen();
                startPolling();
                loadRooms();
            } catch(e) { alert('Ошибка создания: ' + e.message); }
        }

        async function loadRooms() {
            if (!MY_ID || MY_ID === 999999) {
                document.getElementById('myRoomsList').innerHTML = '<div style="color:var(--error);padding:15px;">⚠️ Не удалось определить пользователя.</div>';
                return;
            }
            try {
                const my = await db('rooms', 'GET', null, `?creator_tg_id=eq.${MY_ID}&status=in.(waiting,playing)&order=created_at.desc&limit=10`);
                const pub = await db('rooms', 'GET', null, `?status=eq.waiting&creator_tg_id=neq.${MY_ID}&order=created_at.desc&limit=20`);
                renderRooms('myRoomsList', my, true);
                renderRooms('roomsList', pub, false);
            } catch(e) { document.getElementById('myRoomsList').innerHTML = '<div style="color:red;padding:15px;">'+e.message+'</div>'; }
        }

        function renderRooms(id, rooms, isMy) {
            const c = document.getElementById(id); c.innerHTML = '';
            if (!rooms.length) { c.innerHTML = '<div style="text-align:center;color:var(--sec);padding:20px;">Нет комнат</div>'; return; }
            rooms.forEach(r => {
                const skin = SKINS[0];
                const trulyMine = Number(r.creator_tg_id) === MY_ID;
                const isPlaying = r.status === 'playing';
                const el = document.createElement('div');
                el.className = 'room-card' + (isMy ? ' my-room' : '') + (isPlaying ? ' playing' : '');
                
                if (isMy && isPlaying) {
                    el.onclick = () => resumeRoom(r.id);
                    el.style.cursor = 'pointer';
                }

                if (trulyMine) {
                    const btnText = isPlaying ? '🔄 Вернуться' : '👁 Смотреть';
                    const badgeColor = isPlaying ? 'var(--primary)' : 'var(--success)';
                    const badgeText = isPlaying ? 'ИГРА' : 'ЖДЁТ';
                    el.innerHTML = `<div class="room-icon"><img src="${skin.img}" alt=""></div><div class="room-info"><div class="room-stake">💰 ${r.stake} TON <span style="background:${badgeColor};color:#fff;padding:2px 6px;border-radius:8px;font-size:9px;margin-left:6px;">${badgeText}</span></div><div class="room-creator">@${r.creator_username||'Аноним'}</div></div><div class="room-actions"><button class="room-btn join" onclick="event.stopPropagation(); resumeRoom('${r.id}')">${btnText}</button><button class="room-btn cancel" onclick="event.stopPropagation(); cancelRoom('${r.id}')">✕</button></div>`;
                } else {
                    el.innerHTML = `<div class="room-icon"><img src="${skin.img}" alt=""></div><div class="room-info"><div class="room-stake">💰 ${r.stake} TON</div><div class="room-creator">@${r.creator_username||'Аноним'}</div></div><button class="room-btn join" onclick="joinRoom('${r.id}', this)">Войти</button>`;
                }
                c.appendChild(el);
            });
        }

        async function resumeRoom(roomId) {
            try {
                const rooms = await db('rooms', 'GET', null, `?id=eq.${roomId}&creator_tg_id=eq.${MY_ID}`);
                if (!rooms.length) { alert('Комната не найдена'); loadRooms(); return; }
                currentRoom = rooms[0];
                showGameScreen();
                startPolling();
            } catch(e) { alert('Ошибка: ' + e.message); }
        }

        async function cancelRoom(roomId) {
            try {
                const roomCheck = await db('rooms', 'GET', null, `?id=eq.${roomId}`, false);
                if (!roomCheck.length || Number(roomCheck[0].creator_tg_id) !== MY_ID) { alert('⛔ Только создатель может отменить!'); return; }
                await db('rooms', 'DELETE', null, `?id=eq.${roomId}&status=eq.waiting&creator_tg_id=eq.${MY_ID}`);
                loadRooms();
            } catch(e) { alert('Ошибка: ' + e.message); }
        }

        async function joinRoom(roomId, btnElement) {
            btnElement.disabled = true; btnElement.textContent = '⏳';
            try {
                const check = await db('rooms', 'GET', null, `?id=eq.${roomId}&status=eq.waiting`, false);
                if (!check.length) throw new Error('Комната уже занята');
                const room = await db('rooms', 'PATCH', { opponent_tg_id: MY_ID, opponent_username: user.username, status: 'playing' }, `?id=eq.${roomId}&status=eq.waiting`, true);
                if (!room) throw new Error('Не удалось войти');
                currentRoom = room;
                showGameScreen();
                startPolling();
                loadRooms();
            } catch(e) { alert('Ошибка: ' + e.message); loadRooms(); }
            finally { btnElement.disabled = false; btnElement.textContent = 'Войти'; }
        }

        function showGameScreen() {
            ['lobbyScreen','skinsScreen','leaderboardScreen'].forEach(id=>document.getElementById(id).classList.add('hidden'));
            document.getElementById('gameScreen').classList.remove('hidden');

            const isCreator = String(currentRoom.creator_tg_id) === String(MY_ID);
            const myCol = isCreator ? 'creator_choice' : 'opponent_choice';
            const oppCol = myCol === 'creator_choice' ? 'opponent_choice' : 'creator_choice';

            if (currentRoom[myCol] && currentRoom[oppCol]) {
                document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
                document.getElementById('gameStatus').textContent = '⏳ Подведение итогов...';
            } else if (currentRoom[myCol]) {
                document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
                document.getElementById('gameStatus').textContent = '✅ Ваш ход записан. Ждём соперника...';
            } else {
                document.querySelectorAll('.choice-btn').forEach(b => b.disabled = false);
                document.getElementById('gameStatus').innerHTML = '<div class="spinner"></div>';
            }
            
            isGameFinished = false;
            if (!currentRoom) {
                document.getElementById('gameStatus').textContent = '❌ Ошибка: комната не найдена';
                return;
            }

            const stake = parseFloat(currentRoom.stake || 0);
            document.getElementById('stakeAmount').textContent = stake.toFixed(2);
            document.getElementById('winAmount').textContent = (stake * 2 * 0.95).toFixed(2);

            const skin = SKINS.find(s=>s.id===currentSkin)||SKINS[0];
            document.getElementById('playerAvatarImg').src = skin.img;
            document.getElementById('opponentAvatarImg').src = SKINS[0].img;
            updateGameStatus(currentRoom);
        }

        function updateGameStatus(room) {
            if (!room || isGameFinished) return;
            const statusEl = document.getElementById('gameStatus');
            if (room.status === 'waiting') {
                statusEl.innerHTML = '⏳ Ждём соперника...';
            } else if (room.status === 'playing') {
                const myCol = String(room.creator_tg_id) === String(MY_ID) ? 'creator_choice' : 'opponent_choice';
                const oppCol = myCol === 'creator_choice' ? 'opponent_choice' : 'creator_choice';
                if (room[myCol] && room[oppCol]) {
                    statusEl.innerHTML = '⏳ Подведение итогов...';
                } else if (room[myCol]) {
                    statusEl.innerHTML = '⏳ Соперник думает...';
                } else {
                    statusEl.innerHTML = '👉 Ваш ход!';
                }
            } else {
                statusEl.innerHTML = '🏁 Игра окончена';
            }
        }

        function startPolling() {
            if (pollInterval) clearInterval(pollInterval);
            if (!currentRoom) return;
            isGameFinished = false;

            pollInterval = setInterval(async () => {
                if (!currentRoom || isGameFinished) return;
                try {
                    const res = await db('rooms','GET', null, `?id=eq.${currentRoom.id}`);
                    const room = res[0];
                    if (!room) return;
                    currentRoom = room;
                    updateGameStatus(room);

                    // ✅ Жёсткое завершение, если оба хода сделаны
                    if (room.creator_choice && room.opponent_choice && room.status !== 'finished') {
                        isGameFinished = true;
                        clearInterval(pollInterval); pollInterval = null;
                        await finishGame(room);
                        return;
                    }

                    if (room.status === 'finished') {
                        isGameFinished = true;
                        clearInterval(pollInterval); pollInterval = null;
                        showGameResult(room);
                        return;
                    }
                } catch(e) { console.warn('Poll error:', e); }
            }, 2000);
        }

        async function makeMove(choice) {
            if (!currentRoom || currentRoom.status !== 'playing') return;
            
            const isCreator = String(currentRoom.creator_tg_id) === String(MY_ID);
            const col = isCreator ? 'creator_choice' : 'opponent_choice';

            if (currentRoom[col]) return;

            document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
            document.getElementById('gameStatus').textContent = '✅ Ход записан...';

            try {
                await db('rooms','PATCH', {[col]: choice}, `?id=eq.${currentRoom.id}`);
                currentRoom[col] = choice;
                updateGameStatus(currentRoom);
            } catch(e) {
                alert('Ошибка хода: ' + e.message);
                document.querySelectorAll('.choice-btn').forEach(b => b.disabled = false);
            }
        }

        async function finishGame(room) {
            const result = calculateWinner(room);
            await db('rooms', 'PATCH', { status: 'finished' }, `?id=eq.${room.id}`);
            
            const loserId = String(result.winnerId) === String(room.creator_tg_id) ? room.opponent_tg_id : room.creator_tg_id;
            
            if (result.winnerId) {
                db('users', 'GET', null, `?telegram_id=eq.${result.winnerId}&select=wins`, false)
                  .then(d => db('users', 'PATCH', { wins: (d[0]?.wins || 0) + 1 }, `?telegram_id=eq.${result.winnerId}`))
                  .catch(console.warn);
            }
            if (loserId) {
                db('users', 'GET', null, `?telegram_id=eq.${loserId}&select=losses`, false)
                  .then(d => db('users', 'PATCH', { losses: (d[0]?.losses || 0) + 1 }, `?telegram_id=eq.${loserId}`))
                  .catch(console.warn);
            }

            showGameResult({ ...room, result: result.msg });
        }

        function calculateWinner(room) {
            const { creator_choice: c1, opponent_choice: c2, creator_tg_id: id1, opponent_tg_id: id2 } = room;
            if (c1 === c2) return { msg: '🤝 Ничья!', winnerId: null };
            const beats = { fist: 'spike', spike: 'crystal', crystal: 'fist' };
            const creatorWins = beats[c1] === c2;
            return { msg: (creatorWins ? (String(MY_ID) === String(id1)) : (String(MY_ID) === String(id2))) ? '🏆 Победа!' : '😢 Поражение', winnerId: creatorWins ? id1 : id2 };
        }

        function showGameResult(room) {
            const result = calculateWinner(room);
            const msg = room.result || result.msg;
            const isWin = msg.includes('Победа');
            const isDraw = msg.includes('Ничья');
            
            const statusEl = document.getElementById('gameStatus');
            statusEl.className = `status-box ${isWin ? 'win' : isDraw ? '' : 'lose'}`;
            statusEl.innerHTML = `<div style="animation:celebrate 0.5s ease-in-out; font-size: 18px;">${msg}</div>`;
            
            updateStats();
            
            // Авто-возврат через 3 секунды, но кнопка "В лобби" работает сразу
            setTimeout(() => {
                if (currentRoom) { leaveGame(); }
            }, 3000);
        }

        function renderSkins() {
            const c = document.getElementById('skinsList'); c.innerHTML = '';
            const wins = parseInt(document.getElementById('statWins').textContent)||0;
            SKINS.forEach(skin => {
                const unlocked = wins >= skin.wins;
                const active = currentSkin === skin.id;
                const el = document.createElement('div');
                el.className = 'room-card' + (active?' my-room':'');
                el.onclick = () => openSkinModal(skin, wins);
                el.innerHTML = `<div class="room-icon"><img src="${skin.img}" alt=""></div><div class="room-info"><div class="room-stake">${skin.name}</div><div class="room-creator">${skin.wins} побед</div></div><button class="room-btn ${active?'cancel':'join'}" ${!unlocked?'disabled':''} onclick="event.stopPropagation(); ${unlocked&&!active?`equipSkin('${skin.id}')`:''}">${active?'✓':unlocked?'Надеть':'🔒'}</button>`;
                c.appendChild(el);
            });
        }

        function openSkinModal(skin, userWins) {
            const modal = document.getElementById('skinModal');
            document.getElementById('modalImg').src = skin.img;
            document.getElementById('modalTitle').textContent = skin.name;
            document.getElementById('modalLevel').textContent = `Требуется: ${skin.wins} побед`;
            document.getElementById('modalDesc').textContent = skin.desc;
            const featuresList = document.getElementById('modalFeatures'); featuresList.innerHTML = '';
            skin.features.forEach(feat => { const li = document.createElement('li'); li.textContent = feat; featuresList.appendChild(li); });
            const reqDiv = document.getElementById('modalReq');
            const unlocked = userWins >= skin.wins;
            reqDiv.textContent = unlocked ? '✅ Разблокировано' : `🔒 Нужно ещё ${skin.wins - userWins} побед`;
            reqDiv.className = 'skin-modal-req' + (unlocked ? '' : ' locked');
            modal.classList.remove('hidden');
        }

        function closeSkinModal(e) {
            if (!e || e.target.id === 'skinModal' || e.target.className === 'skin-modal-close') {
                document.getElementById('skinModal').classList.add('hidden');
            }
        }

        function equipSkin(id) { currentSkin = id; renderSkins(); updateStats(); }

        async function loadLeaderboard() {
            const c = document.getElementById('leaderboardList');
            try {
                const users = await db('users','GET',null,'?select=username,wins,losses,telegram_id&order=wins.desc.nullslast&limit=10');
                c.innerHTML = '';
                users.forEach((u,i) => {
                    const wins = u.wins || 0;
                    const skin = SKINS[wins>=300?4:wins>=100?3:wins>=50?2:wins>=30?1:0];
                    const name = u.username || `Player_${String(u.telegram_id).slice(-4)}`;
                    const el = document.createElement('div');
                    el.className = 'room-card';
                    el.innerHTML = `<div style="font-weight:700;width:30px;">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</div><div class="room-icon"><img src="${skin.img}" alt=""></div><div class="room-info"><div class="room-stake">@${name}</div><div class="lb-stats"><span>✅ ${wins}</span><span>❌ ${u.losses || 0}</span></div></div>`;
                    c.appendChild(el);
                });
            } catch(e) { c.innerHTML = '<div style="color:red;padding:15px;">'+e.message+'</div>'; }
        }

        window.addEventListener('load', () => { setTimeout(() => { loadRooms(); updateStats(); }, 300); });
    </script>
</body>
</html>
