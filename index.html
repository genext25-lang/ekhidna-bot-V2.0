<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ехидна Naklz - SAFE MODE</title>
    <style>
        /* Стили остались те же */
        :root { --bg: #121212; --card: #1e1e1e; --primary: #4facfe; --success: #43e97b; --text: #fff; --sec: #888; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 400px; }
        .header { text-align: center; margin-bottom: 20px; }
        .echidna { width: 100px; height: 100px; background: #fff; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 50px; animation: bounce 2s infinite; }
        @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        h1 { margin-bottom: 5px; }
        .subtitle { color: var(--sec); font-size: 13px; }
        
        .btn { width: 100%; padding: 14px; margin: 8px 0; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; color: #fff; transition: transform 0.1s; }
        .btn:active { transform: scale(0.95); background: #555; } /* Визуальный отклик */
        .btn-primary { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        .btn-success { background: linear-gradient(135deg, #43e97b, #38f9d7); }
        .btn-error { background: linear-gradient(135deg, #ff4757, #ff6b81); }
        .btn-sec { background: linear-gradient(135deg, #fa709a, #fee140); color: #000; }
        
        .card { background: var(--card); padding: 12px; border-radius: 10px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .choices { display: flex; justify-content: space-around; margin-top: 20px; gap: 10px; }
        .choice-btn { flex: 1; height: 80px; border: none; border-radius: 14px; font-size: 32px; background: var(--card); color: white; cursor: pointer; }
        .status { background: var(--card); padding: 12px; border-radius: 10px; margin: 15px 0; text-align: center; min-height: 40px; }
        .hidden { display: none !important; }
        .banner { background: #ff4757; color: white; padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: center; font-weight: bold; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div id="banner" class="banner">️ SAFE MODE: Библиотеки отключены</div>

        <div id="menuScreen">
            <div class="header">
                <div class="echidna"></div>
                <h1>Ехидна Naklz</h1>
                <div class="subtitle">Кулак ✊ • Шип 🌵 • Кристалл 💎</div>
            </div>
            
            <!-- Простые вызовы функций -->
            <button class="btn btn-success" onclick="testCreate()">💎 Создать комнату (Тест)</button>
            <button class="btn btn-primary" onclick="testFind()">🔍 Найти комнату (Тест)</button>
            <button class="btn btn-error" onclick="alert('Кнопка 3 работает!')">🧪 Кнопка 3</button>
            <div id="roomsList"></div>
        </div>

        <div id="gameScreen" class="hidden">
            <div class="header">
                <div class="echidna"></div>
                <h2>Битва!</h2>
            </div>
            <div class="status" id="gameStatus">Ожидание...</div>
            <div class="choices">
                <button class="choice-btn" onclick="testMove('fist')">✊</button>
                <button class="choice-btn" onclick="testMove('spike')">🌵</button>
                <button class="choice-btn" onclick="testMove('crystal')"></button>
            </div>
            <button class="btn btn-sec" style="margin-top:15px;" onclick="backToMenu()">🚪 Назад</button>
        </div>
    </div>

    <script>
        console.log("🚀 Скрипт запущен!");
        alert("👋 Привет! Скрипт работает.");

        // Проверка Telegram
        let tg = null;
        try {
            if (window.Telegram && window.Telegram.WebApp) {
                tg = window.Telegram.WebApp;
                tg.ready();
                console.log("✅ Telegram SDK найден");
            } else {
                console.log("⚠️ Telegram SDK не найден");
            }
        } catch(e) {
            console.error("Ошибка TG:", e);
        }

        // === ФУНКЦИИ (Простые, без Supabase) ===

        function testCreate() {
            console.log("Нажата Создать комнату");
            alert("✅ Кнопка 'Создать комнату' работает!");
            
            // Переход в игру
            document.getElementById('menuScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            document.getElementById('gameStatus').innerText = "Демо-игра. Делай ход!";
        }

        function testFind() {
            console.log("Нажата Найти комнату");
            alert("✅ Кнопка 'Найти комнату' работает!");
            
            const list = document.getElementById('roomsList');
            list.innerHTML = '<div class="card"><div>Демо-комната</div><button class="btn btn-primary" style="width:auto; padding:5px 10px;" onclick="alert(\'Вход выполнен\')">Войти</button></div>';
        }

        function testMove(choice) {
            console.log("Ход:", choice);
            alert("Ты выбрал: " + choice);
            document.getElementById('gameStatus').innerText = "Ждем соперника...";
        }

        function backToMenu() {
            document.getElementById('menuScreen').classList.remove('hidden');
            document.getElementById('gameScreen').classList.add('hidden');
        }

        console.log("✅ Все функции загружены.");
    </script>
</body>
</html>
