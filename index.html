<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ехидна Naklz</title>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --primary: #4facfe; --success: #43e97b; --error: #ff4757; --text: #fff; --sec: #888; --my-room: #2d3436; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 400px; }
        .header { text-align: center; margin-bottom: 20px; }
        .echidna { width: 100px; height: 100px; background: #fff; border-radius: 50%; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 50px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); animation: bounce 2s infinite; }
        @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        h1 { margin-bottom: 5px; font-size: 24px; }
        .subtitle { color: var(--sec); font-size: 13px; }
        .btn { width: 100%; padding: 14px; margin: 8px 0; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; color: #fff; transition: transform 0.1s; }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: linear-gradient(135deg, #4facfe, #00f2fe); }
        .btn-success { background: linear-gradient(135deg, #43e97b, #38f9d7); }
        .btn-error { background: linear-gradient(135deg, #ff4757, #ff6b81); }
        .btn-sec { background: linear-gradient(135deg, #fa709a, #fee140); color: #000; }
        .room-card { background: var(--card); padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--primary); }
        .room-card.my-room { background: var(--my-room); border-left-color: var(--success); }
        .room-info { flex: 1; }
        .room-stake { font-size: 18px; font-weight: bold; color: #ffd700; }
        .room-creator { font-size: 13px; color: var(--sec); margin: 4px 0; }
        .room-time { font-size: 11px; color: #666; }
        .room-badge { display: inline-block; background: var(--success); color: #000; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: bold; margin-left: 8px; }
        .room-actions { display: flex; gap: 8px; }
        .room-btn { border: none; padding: 8px 12px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 13px; }
        .room-btn.join { background: var(--primary); color: white; }
        .room-btn.cancel { background: var(--error); color: white; }
        .room-btn:active { transform: scale(0.95); }
        .section-title { font-size: 14px; color: var(--sec); margin: 20px 0 10px; display: flex; align-items: center; gap: 8px; }
        .section-title::before { content: ''; display: block; width: 3px; height: 14px; background: var(--primary); border-radius: 2px; }
        .choices { display: flex; justify-content: space-around; margin-top: 20px; gap: 10px; }
        .choice-btn { flex: 1; height: 80px; border: none; border-radius: 14px; font-size: 32px; background: var(--card); color: white; cursor: pointer; }
        .choice-btn:active { transform: scale(0.95); }
        .choice-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .status { background: var(--card); padding: 12px; border-radius: 10px; margin: 15px 0; text-align: center; min-height: 40px; font-size: 15px; }
        .hidden { display: none !important; }
        .loader { text-align: center; padding: 20px; color: var(--sec); }
        .spinner { border: 3px solid rgba(255,255,255,0.2); border-top: 3px solid var(--primary); border-radius: 50%; width: 24px; height: 24px; animation: spin 0.8s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .empty-list { text-align: center; color: var(--sec); padding: 30px 10px; }
        .error-debug { background: #1a0a0a; border: 1px solid var(--error); color: #ff8888; padding: 10px; border-radius: 8px; margin: 10px 0; font-size: 11px; font-family: monospace; display: none; }
        .error-debug.show { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div id="errorDebug" class="error-debug"></div>
        
        <div id="lobbyScreen">
            <div class="header">
                <div class="echidna">🦔</div>
                <h1>Ехидна Naklz</h1>
                <div class="subtitle">Кулак ✊ • Шип 🌵 • Кристалл 💎</div>
            </div>
            <button class="btn btn-success" onclick="createRoom()">💎 Создать комнату (0.1 TON)</button>
            <button class="btn btn-primary" onclick="loadRooms()">🔄 Обновить</button>
            
            <div class="section-title">🕐 Мои ожидающие комнаты</div>
            <div id="myRoomsList"><div class="loader"><div class="spinner"></div>Загрузка...</div></div>
            
            <div class="section-title">🌍 Доступные комнаты</div>
            <div id="roomsList"><div class="loader"><div class="spinner"></div>Загрузка...</div></div>
        </div>

        <div id="gameScreen" class="hidden">
            <div class="header">
                <div class="echidna">🦔</div>
                <h2>Битва!</h2>
            </div>
            <div class="status" id="gameStatus">Ожидание соперника...</div>
            <div class="choices">
                <button class="choice-btn" onclick="makeMove('fist')">✊</button>
                <button class="choice-btn" onclick="makeMove('spike')">🌵</button>
                <button class="choice-btn" onclick="makeMove('crystal')">💎</button>
            </div>
            <button class="btn btn-sec" style="margin-top:15px;" onclick="backToLobby()">🚪 В лобби</button>
        </div>
    </div>

    <script>
        // ==========================================
        // ⚠️ ВСТАВЬ СВОЙ SUPABASE_KEY ⚠️
        // ==========================================
        const SUPABASE_URL = 'https://tejndwtckdvueufqhitu.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_lNnsJa932mOhwMX21GSnWQ_UG2TjSoe';
        // ==========================================

        async function db(table, method, payload = null, filters = '') {
            if (!SUPABASE_URL.startsWith('https://') || SUPABASE_KEY.length < 20 || SUPABASE_KEY.includes('ВСТАВЬ')) {
                throw new Error('❌ SUPABASE_KEY не заполнен!');
            }
            const url = `${SUPABASE_URL}/rest/v1/${table}${filters}`;
            const headers = {
                'apikey': SUPABASE_KEY,
                'Authorization': `Bearer ${SUPABASE_KEY}`,
                'Content-Type': 'application/json',
                'Prefer': 'return=representation',
                'Accept': 'application/json'
            };
            const options = { method, headers };
            if (payload) options.body = JSON.stringify(payload);
            
            const response = await fetch(url, options);
            const text = await response.text();
            
            if (!response.ok) {
                // Показываем детальную ошибку в интерфейсе
                const errorBox = document.getElementById('errorDebug');
                errorBox.textContent = `Supabase Error ${response.status}:\n${text}`;
                errorBox.classList.add('show');
                throw new Error(`Supabase ${response.status}: ${text}`);
            }
            if (!text) return null;
            const data = JSON.parse(text);
            return Array.isArray(data) && data.length === 1 ? data[0] : data;
        }

        function parseRealUser() {
            if (window.Telegram?.WebApp?.initDataUnsafe?.user) {
                return window.Telegram.WebApp.initDataUnsafe.user;
            }
            try {
                const hash = window.location.hash.startsWith('#') ? window.location.hash.slice(1) : window.location.hash;
                const search = window.location.search.startsWith('?') ? window.location.search.slice(1) : window.location.search;
                const full = `${hash}&${search}`;
                const params = new URLSearchParams(full);
                const tgData = params.get('tgWebAppData');
                if (tgData) {
                    const dataParams = new URLSearchParams(decodeURIComponent(tgData));
                    const userJSON = dataParams.get('user');
                    if (userJSON) return JSON.parse(decodeURIComponent(userJSON));
                }
            } catch (e) { console.warn('User parse error:', e); }
            return { id: 999999, username: 'Guest', first_name: 'Гость' };
        }

        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready?.(); tg.expand?.(); }
        const user = parseRealUser();

        let currentRoom = null;
        let pollInterval = null;

        function showError(msg) { 
            alert('⚠️ ' + msg);
            // Также показываем в красном блоке
            const errorBox = document.getElementById('errorDebug');
            errorBox.textContent = msg;
            errorBox.classList.add('show');
        }

        async function createRoom() {
            try {
                document.getElementById('errorDebug').classList.remove('show');
                const room = await db('rooms', 'POST', [{
                    creator_tg_id: user.id,
                    creator_username: user.username,
                    stake: 0.10,
                    status: 'waiting',
                    creator_choice: null,
                    opponent_choice: null
                }]);
                currentRoom = room;
                showGame('✅ Комната создана! Ждём соперника...');
                startPolling();
                loadRooms();
            } catch (e) { showError(e.message); }
        }

        async function cancelRoom(roomId) {
            if (!confirm('Отменить эту комнату?')) return;
            try {
                await db('rooms', 'DELETE', null, `?id=eq.${roomId}&status=eq.waiting&creator_tg_id=eq.${user.id}`);
                loadRooms();
            } catch (e) { showError('Не удалось отменить: ' + e.message); }
        }

        async function loadRooms() {
            document.getElementById('errorDebug').classList.remove('show');
            
            // Мои комнаты
            try {
                const myRooms = await db('rooms', 'GET', null, `?status=eq.waiting&creator_tg_id=eq.${user.id}&order=created_at.desc&limit=10`);
                renderMyRooms(myRooms);
            } catch (e) { 
                document.getElementById('myRoomsList').innerHTML = `<div style="color:var(--error);padding:10px;">Ошибка: ${e.message}</div>`;
                console.error('My rooms error:', e);
            }
            
            // Чужие комнаты
            try {
                const rooms = await db('rooms', 'GET', null, `?status=eq.waiting&creator_tg_id=neq.${user.id}&order=created_at.desc&limit=20`);
                renderPublicRooms(rooms);
            } catch (e) { 
                document.getElementById('roomsList').innerHTML = `<div style="color:var(--error);padding:10px;">Ошибка: ${e.message}</div>`;
                console.error('Public rooms error:', e);
            }
        }

        function renderMyRooms(rooms) {
            const container = document.getElementById('myRoomsList');
            container.innerHTML = '';
            if (!rooms || rooms.length === 0) { container.innerHTML = '<div class="empty-list">Нет ожидающих комнат</div>'; return; }
            rooms.forEach(room => {
                const el = document.createElement('div');
                el.className = 'room-card my-room';
                el.innerHTML = `
                    <div class="room-info">
                        <div class="room-stake">💰 ${room.stake} TON <span class="room-badge">ЖДЁТ</span></div>
                        <div class="room-creator">@${room.creator_username || 'Аноним'}</div>
                        <div class="room-time">🕐 ${formatTime(room.created_at)}</div>
                    </div>
                    <div class="room-actions">
                        <button class="room-btn cancel" onclick="cancelRoom('${room.id}')">✕</button>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        function renderPublicRooms(rooms) {
            const container = document.getElementById('roomsList');
            container.innerHTML = '';
            if (!rooms || rooms.length === 0) { container.innerHTML = '<div class="empty-list">Нет доступных комнат</div>'; return; }
            rooms.forEach(room => {
                const el = document.createElement('div');
                el.className = 'room-card';
                el.innerHTML = `
                    <div class="room-info">
                        <div class="room-stake">💰 ${room.stake} TON</div>
                        <div class="room-creator">@${room.creator_username || 'Аноним'}</div>
                        <div class="room-time">🕐 ${formatTime(room.created_at)}</div>
                    </div>
                    <div class="room-actions">
                        <button class="room-btn join" onclick="joinRoom('${room.id}')">Войти</button>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        async function joinRoom(roomId) {
            try {
                const room = await db('rooms', 'PATCH', { opponent_tg_id: user.id, opponent_username: user.username, status: 'playing' }, `?id=eq.${roomId}&status=eq.waiting`);
                if (!room) { showError('Комната уже занята'); loadRooms(); return; }
                currentRoom = room;
                showGame('✅ Вы в игре! Сделайте ход 👇');
                startPolling();
            } catch (e) { showError(e.message); }
        }

        async function makeMove(choice) {
            if (!currentRoom) return;
            const isCreator = currentRoom.creator_tg_id === user.id;
            const col = isCreator ? 'creator_choice' : 'opponent_choice';
            document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
            document.getElementById('gameStatus').innerText = 'Ход записан...';
            try {
                await db('rooms', 'PATCH', { [col]: choice }, `?id=eq.${currentRoom.id}`);
                document.getElementById('gameStatus').innerText = 'Ждём соперника...';
            } catch (e) { showError(e.message); document.querySelectorAll('.choice-btn').forEach(b => b.disabled = false); }
        }

        function startPolling() {
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(async () => {
                if (!currentRoom) return;
                try {
                    const rooms = await db('rooms', 'GET', null, `?id=eq.${currentRoom.id}`);
                    const room = rooms?.[0];
                    if (!room) return;
                    currentRoom = room;
                    if (room.status === 'finished') { clearInterval(pollInterval); showResult(room); return; }
                    if (room.creator_choice && room.opponent_choice && room.status === 'playing') {
                        clearInterval(pollInterval); await finishGame(room);
                    } else if (!room.opponent_choice && room.creator_choice) {
                        document.getElementById('gameStatus').innerText = 'Соперник думает...';
                    }
                } catch (e) { console.warn('Poll error:', e); }
            }, 2000);
        }

        async function finishGame(room) {
            const result = calculateWinner(room);
            await db('rooms', 'PATCH', { status: 'finished' }, `?id=eq.${room.id}`);
            if (result.winnerId) { try { await db('users', 'PATCH', { wins: 1 }, `?telegram_id=eq.${result.winnerId}`); } catch(e) {} }
            showResult({ ...room, result: result.msg });
        }

        function calculateWinner(room) {
            const { creator_choice: c1, opponent_choice: c2, creator_tg_id: id1, opponent_tg_id: id2 } = room;
            if (c1 === c2) return { msg: '🤝 Ничья!', winnerId: null };
            const beats = { fist: 'spike', spike: 'crystal', crystal: 'fist' };
            const creatorWins = beats[c1] === c2;
            return { msg: (creatorWins ? (user.id === id1) : (user.id === id2)) ? '🏆 Ты победил!' : '😢 Ты проиграл', winnerId: creatorWins ? id1 : id2 };
        }

        function showResult(room) {
            const msg = room.result || calculateWinner(room).msg;
            document.getElementById('gameStatus').innerText = msg;
            alert(msg);
            setTimeout(backToLobby, 3000);
        }

        function showGame(statusText) {
            document.getElementById('lobbyScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            document.getElementById('gameStatus').innerText = statusText || 'Сделайте ход 👇';
            document.querySelectorAll('.choice-btn').forEach(b => b.disabled = false);
        }

        function backToLobby() {
            if (pollInterval) clearInterval(pollInterval);
            currentRoom = null;
            document.getElementById('lobbyScreen').classList.remove('hidden');
            document.getElementById('gameScreen').classList.add('hidden');
            loadRooms();
        }

        function formatTime(iso) {
            if (!iso) return '';
            const diff = Math.floor((Date.now() - new Date(iso)) / 1000);
            if (diff < 60) return 'только что';
            if (diff < 3600) return `${Math.floor(diff/60)} мин назад`;
            return new Date(iso).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
        }

        window.addEventListener('load', () => setTimeout(loadRooms, 300));
    </script>
</body>
</html>
