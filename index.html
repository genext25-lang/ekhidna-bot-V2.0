<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ехидна Naklz</title>
    <style>
        :root { --bg: #0a0a1a; --card: #1a1a2e; --primary: #6366f1; --success: #10b981; --error: #ef4444; --gold: #fbbf24; --text: #f8fafc; --sec: #94a3b8; --border: #334155; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding: 15px; }
        .container { max-width: 420px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 20px; }
        .header-logo { width: 120px; height: 120px; margin: 0 auto 12px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 30px rgba(99,102,241,0.5); animation: float 3s ease-in-out infinite; }
        .header-logo img { width: 100%; height: 100%; object-fit: cover; }
        @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .header h1 { font-size: 22px; margin-bottom: 5px; background: linear-gradient(135deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-sub { font-size: 12px; color: var(--sec); }
        .player-stats { display: flex; gap: 8px; margin-bottom: 16px; background: var(--card); border-radius: 16px; padding: 12px; border: 1px solid var(--border); }
        .stat-box { flex: 1; text-align: center; }
        .stat-val { font-size: 20px; font-weight: 700; color: var(--primary); }
        .stat-lbl { font-size: 10px; color: var(--sec); text-transform: uppercase; }
        .skin-badge { display: inline-block; background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #000; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px; margin-top: 4px; }
        .btn { width: 100%; padding: 14px; margin: 6px 0; border: none; border-radius: 14px; font-size: 14px; font-weight: 600; cursor: pointer; color: #fff; }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
        .btn-success { background: linear-gradient(135deg, #10b981, #059669); }
        .btn-sec { background: var(--card); border: 1px solid var(--border); color: var(--sec); }
        .section-title { font-size: 13px; color: var(--sec); margin: 18px 0 8px; text-transform: uppercase; }
        .room-card { background: var(--card); border-radius: 14px; margin-bottom: 8px; padding: 14px; display: flex; align-items: center; gap: 12px; border: 1px solid var(--border); }
        .room-card.my-room { border-left: 3px solid var(--success); }
        .room-icon { width: 44px; height: 44px; border-radius: 12px; overflow: hidden; flex-shrink: 0; }
        .room-icon img { width: 100%; height: 100%; object-fit: cover; }
        .room-info { flex: 1; }
        .room-stake { font-weight: 700; color: var(--gold); }
        .room-creator { font-size: 12px; color: var(--sec); }
        .room-btn { padding: 8px 14px; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; }
        .room-btn.join { background: var(--primary); color: #fff; }
        .room-btn.cancel { background: var(--error); color: #fff; }
        .game-players { display: flex; justify-content: space-around; align-items: center; margin: 15px 0; }
        .player-avatar { width: 80px; height: 80px; border-radius: 50%; overflow: hidden; border: 3px solid var(--border); }
        .player-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .vs-badge { font-size: 20px; font-weight: 700; color: var(--error); }
        .choices { display: flex; justify-content: center; gap: 12px; margin: 20px 0; }
        .choice-btn { width: 90px; height: 90px; border: 2px solid var(--border); border-radius: 20px; background: var(--card); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .choice-btn svg { width: 40px; height: 40px; margin-bottom: 4px; }
        .choice-btn span { font-size: 10px; color: var(--sec); }
        .choice-btn:disabled { opacity: 0.4; }
        .status-box { background: var(--card); border-radius: 14px; padding: 16px; text-align: center; margin: 15px 0; border: 1px solid var(--border); min-height: 50px; }
        .hidden { display: none !important; }
        .loader { text-align: center; padding: 30px; color: var(--sec); }
        .spinner { border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; width: 28px; height: 28px; animation: spin 0.8s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); border-top: 1px solid var(--border); display: flex; padding: 8px 0; z-index: 100; }
        .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; color: var(--sec); font-size: 10px; cursor: pointer; }
        .nav-btn.active { color: var(--primary); }
        .nav-spacer { height: 60px; }
    </style>
</head>
<body>
    <div class="container">
        <div id="lobbyScreen">
            <div class="header">
                <div class="header-logo"><img src="" id="mainLogoImg" alt="logo"></div>
                <h1>Ехидна Naklz</h1>
                <div class="header-sub">Кулак • Шип • Кристалл</div>
            </div>
            <div class="player-stats">
                <div class="stat-box"><div class="stat-val" id="statWins">0</div><div class="stat-lbl">Побед</div></div>
                <div class="stat-box"><div class="stat-val" id="statGames">0</div><div class="stat-lbl">Игр</div></div>
                <div class="stat-box"><div class="stat-val" id="statLevel">1</div><div class="stat-lbl">Уровень</div><div class="skin-badge" id="statSkinBadge">Обычная</div></div>
            </div>
            <button class="btn btn-success" onclick="createRoom()">💎 Создать комнату</button>
            <button class="btn btn-sec" onclick="loadRooms()">🔄 Обновить</button>
            <div class="section-title">Мои комнаты</div>
            <div id="myRoomsList"><div class="loader"><div class="spinner"></div></div></div>
            <div class="section-title">Доступные комнаты</div>
            <div id="roomsList"><div class="loader"><div class="spinner"></div></div></div>
            <div class="nav-spacer"></div>
        </div>

        <div id="gameScreen" class="hidden">
            <div class="header"><h2>⚔️ Битва!</h2></div>
            <div class="game-players">
                <div class="player-avatar"><img src="" id="playerAvatarImg" alt="player"></div>
                <div class="vs-badge">VS</div>
                <div class="player-avatar"><img src="" id="opponentAvatarImg" alt="opponent"></div>
            </div>
            <div class="status-box" id="gameStatus"><div class="spinner"></div></div>
            <div class="choices">
                <button class="choice-btn" onclick="makeMove('fist')"><svg viewBox="0 0 64 64" fill="none"><rect x="12" y="8" width="40" height="48" rx="8" fill="#ef4444"/></svg><span>Кулак</span></button>
                <button class="choice-btn" onclick="makeMove('spike')"><svg viewBox="0 0 64 64" fill="none"><path d="M32 4C20 4 16 20 16 32c0 8 4 16 8 24h16c4-8 8-16 8-24C48 20 44 4 32 4z" fill="#22c55e"/></svg><span>Шип</span></button>
                <button class="choice-btn" onclick="makeMove('crystal')"><svg viewBox="0 0 64 64" fill="none"><polygon points="32,4 52,20 44,56 20,56 12,20" fill="#60a5fa"/></svg><span>Кристалл</span></button>
            </div>
            <button class="btn btn-sec" onclick="showScreen('lobby')">🏠 В лобби</button>
            <div class="nav-spacer"></div>
        </div>

        <div id="skinsScreen" class="hidden">
            <div class="header"><h2>🎨 Скины</h2></div>
            <div id="skinsList"></div>
            <div class="nav-spacer"></div>
        </div>

        <div id="leaderboardScreen" class="hidden">
            <div class="header"><h2>🏆 Рейтинг</h2></div>
            <div id="leaderboardList"><div class="loader"><div class="spinner"></div></div></div>
            <div class="nav-spacer"></div>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-btn active" onclick="showScreen('lobby')"><span>🏠</span><span>Лобби</span></button>
        <button class="nav-btn" onclick="showScreen('game')"><span>🎮</span><span>Игра</span></button>
        <button class="nav-btn" onclick="showScreen('skins')"><span>🎨</span><span>Скины</span></button>
        <button class="nav-btn" onclick="showScreen('leaderboard')"><span>🏆</span><span>Рейтинг</span></button>
    </div>

    <script>
        const SUPABASE_URL = 'https://tejndwtckdvueufqhitu.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_lNnsJa932mOhwMX21GSnWQ_UG2TjSoe';
        
        // GitHub Pages URLs
        const SKINS = [
            { id: 'default', name: 'Обычная', wins: 0, img: 'https://genext25-lang.github.io/ekhida-bot-V2.0/skin-default.png' },
            { id: 'ice', name: 'Ледяная', wins: 3, img: 'https://genext25-lang.github.io/ekhida-bot-V2.0/skin-ice.png' },
            { id: 'fire', name: 'Огненная', wins: 8, img: 'https://genext25-lang.github.io/ekhida-bot-V2.0/skin-fire.png' },
            { id: 'shadow', name: 'Теневая', wins: 15, img: 'https://genext25-lang.github.io/ekhida-bot-V2.0/skin-shadow.png' },
            { id: 'golden', name: 'Золотая', wins: 30, img: 'https://genext25-lang.github.io/ekhida-bot-V2.0/skin-golden.png' }
        ];

        async function db(table, method, payload = null, filters = '', single = false) {
            const url = `${SUPABASE_URL}/rest/v1/${table}${filters}`;
            const headers = { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`, 'Content-Type': 'application/json', 'Prefer': 'return=representation' };
            const res = await fetch(url, { method, headers, body: payload ? JSON.stringify(payload) : null });
            if (!res.ok) throw new Error(await res.text());
            const data = await res.json();
            return single && Array.isArray(data) ? data[0] : data;
        }

        const tg = window.Telegram?.WebApp;
        if (tg) { tg.ready?.(); tg.expand?.(); }
        const user = tg?.initDataUnsafe?.user || { id: 999999, username: 'Test' };
        let currentRoom = null, pollInterval = null, currentSkin = 'default';

        function showScreen(name) {
            ['lobbyScreen','gameScreen','skinsScreen','leaderboardScreen'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById(name + 'Screen').classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach((b,i) => b.classList.toggle('active', ['lobby','game','skins','leaderboard'].indexOf(name) === i));
            if (name === 'lobby') { loadRooms(); updateStats(); }
            if (name === 'skins') renderSkins();
            if (name === 'leaderboard') loadLeaderboard();
        }

        async function updateStats() {
            try {
                const data = await db('users', 'GET', null, `?telegram_id=eq.${user.id}&select=wins`, false);
                const wins = data[0]?.wins || 0;
                document.getElementById('statWins').textContent = wins;
                document.getElementById('statGames').textContent = wins * 2;
                const skinIdx = SKINS.slice().reverse().findIndex(s => wins >= s.wins);
                currentSkin = skinIdx >= 0 ? SKINS[SKINS.length - 1 - skinIdx].id : 'default';
                const skin = SKINS.find(s => s.id === currentSkin);
                document.getElementById('statLevel').textContent = SKINS.findIndex(s => s.id === currentSkin) + 1;
                document.getElementById('statSkinBadge').textContent = skin.name;
                document.getElementById('mainLogoImg').src = skin.img;
            } catch(e) { console.error(e); }
        }

        async function createRoom() {
            try {
                const room = await db('rooms', 'POST', [{ creator_tg_id: user.id, creator_username: user.username, stake: 0.1, status: 'waiting' }], '', true);
                currentRoom = room;
                showGameScreen();
                startPolling();
                loadRooms();
            } catch(e) { alert('Ошибка: ' + e.message); }
        }

        async function loadRooms() {
            try {
                const my = await db('rooms', 'GET', null, `?status=eq.waiting&creator_tg_id=eq.${user.id}&order=created_at.desc&limit=10`);
                const pub = await db('rooms', 'GET', null, `?status=eq.waiting&creator_tg_id=neq.${user.id}&order=created_at.desc&limit=20`);
                renderRooms('myRoomsList', my, true);
                renderRooms('roomsList', pub, false);
            } catch(e) { document.getElementById('myRoomsList').innerHTML = '<div style="color:red;padding:15px;">'+e.message+'</div>'; }
        }

        function renderRooms(id, rooms, isMy) {
            const c = document.getElementById(id);
            c.innerHTML = '';
            if (!rooms.length) { c.innerHTML = '<div style="text-align:center;color:var(--sec);padding:20px;">Нет комнат</div>'; return; }
            rooms.forEach(r => {
                const skin = SKINS[0];
                const el = document.createElement('div');
                el.className = 'room-card' + (isMy ? ' my-room' : '');
                el.innerHTML = `<div class="room-icon"><img src="${skin.img}" alt=""></div><div class="room-info"><div class="room-stake">💰 ${r.stake} TON ${isMy?'<span style="background:var(--success);color:#000;padding:2px 6px;border-radius:8px;font-size:9px;margin-left:6px;">ЖДЁТ</span>':''}</div><div class="room-creator">@${r.creator_username||'Аноним'}</div></div><button class="room-btn ${isMy?'cancel':'join'}" onclick="${isMy?`cancelRoom('${r.id}')`: `joinRoom('${r.id}')`}">${isMy?'✕':'Войти'}</button>`;
                c.appendChild(el);
            });
        }

        async function cancelRoom(id) { if(confirm('Удалить?')) { await db('rooms','DELETE',null,`?id=eq.${id}&status=eq.waiting&creator_tg_id=eq.${user.id}`); loadRooms(); } }
        async function joinRoom(id) {
            try {
                const room = await db('rooms','PATCH',{opponent_tg_id:user.id,status:'playing'},`?id=eq.${id}&status=eq.waiting`,true);
                if(!room) { alert('Комната занята'); return; }
                currentRoom = room;
                showGameScreen();
                startPolling();
            } catch(e) { alert(e.message); }
        }

        function showGameScreen() {
            ['lobbyScreen','skinsScreen','leaderboardScreen'].forEach(id=>document.getElementById(id).classList.add('hidden'));
            document.getElementById('gameScreen').classList.remove('hidden');
            document.getElementById('gameStatus').innerHTML = 'Ожидание...';
            const skin = SKINS.find(s=>s.id===currentSkin)||SKINS[0];
            document.getElementById('playerAvatarImg').src = skin.img;
            document.getElementById('opponentAvatarImg').src = SKINS[0].img;
        }

        async function makeMove(choice) {
            const col = currentRoom.creator_tg_id === user.id ? 'creator_choice' : 'opponent_choice';
            document.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);
            document.getElementById('gameStatus').textContent = 'Ход записан...';
            await db('rooms','PATCH',{[col]:choice},`?id=eq.${currentRoom.id}`);
            document.getElementById('gameStatus').textContent = 'Ждём соперника...';
        }

        function startPolling() {
            if(pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(async () => {
                if(!currentRoom) return;
                const rooms = await db('rooms','GET',null,`?id=eq.${currentRoom.id}`);
                const room = rooms[0];
                if(!room) return;
                currentRoom = room;
                if(room.status==='finished') { clearInterval(pollInterval); alert('Игра окончена!'); showScreen('lobby'); return; }
                if(room.creator_choice && room.opponent_choice) {
                    clearInterval(pollInterval);
                    const beats = {fist:'spike',spike:'crystal',crystal:'fist'};
                    const c1w = beats[room.creator_choice]===room.opponent_choice;
                    const iWin = (c1w && user.id===room.creator_tg_id) || (!c1w && user.id===room.opponent_tg_id);
                    alert(iWin?'🏆 Победа!':'😢 Поражение');
                    showScreen('lobby');
                }
            }, 2000);
        }

        function renderSkins() {
            const c = document.getElementById('skinsList');
            c.innerHTML = '';
            const wins = parseInt(document.getElementById('statWins').textContent)||0;
            SKINS.forEach(skin => {
                const unlocked = wins >= skin.wins;
                const active = currentSkin === skin.id;
                const el = document.createElement('div');
                el.className = 'room-card' + (active?' my-room':'');
                el.innerHTML = `<div class="room-icon"><img src="${skin.img}" alt=""></div><div class="room-info"><div class="room-stake">${skin.name}</div><div class="room-creator">${skin.wins} побед</div></div><button class="room-btn ${active?'cancel':'join'}" ${!unlocked?'disabled':''} onclick="${unlocked&&!active?`equipSkin('${skin.id}')`:''}">${active?'✓':unlocked?'Надеть':'🔒'}</button>`;
                c.appendChild(el);
            });
        }

        function equipSkin(id) { currentSkin = id; renderSkins(); updateStats(); }

        async function loadLeaderboard() {
            const c = document.getElementById('leaderboardList');
            try {
                const users = await db('users','GET',null,'?select=username,wins,telegram_id&order=wins.desc.nullslast&limit=10');
                c.innerHTML = '';
                users.forEach((u,i) => {
                    const skin = SKINS[Math.min(4, u.wins>=30?4:u.wins>=15?3:u.wins>=8?2:u.wins>=3?1:0)];
                    const el = document.createElement('div');
                    el.className = 'room-card';
                    el.innerHTML = `<div style="font-weight:700;width:30px;">${i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1}</div><div class="room-icon"><img src="${skin.img}" alt=""></div><div class="room-info"><div class="room-stake">@${u.username||'Аноним'}</div><div class="room-creator">${skin.name}</div></div><div style="font-weight:700;color:var(--gold)">${u.wins||0}</div>`;
                    c.appendChild(el);
                });
            } catch(e) { c.innerHTML = '<div style="color:red;padding:15px;">'+e.message+'</div>'; }
        }

        window.addEventListener('load', () => { setTimeout(() => { loadRooms(); updateStats(); }, 300); });
    </script>
</body>
</html>
